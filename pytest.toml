# pytest configuration for the whole workspace.
# Source: https://docs.pytest.org/en/stable/explanation/goodpractices.html
#   - tests live outside application code, beside each package's src/
#   - new projects use the importlib import mode, so test files in different packages may share a name
[pytest]
addopts = ["--import-mode=importlib"]
testpaths = ["tests", "packages"]
# Registering a custom mark: https://docs.pytest.org/en/stable/how-to/mark.html ("Registering marks").
markers = [
    "no_position_without_its_exit(clause): a case of ADR 0150's clause `clause` (1 to 7), that every position has its exit, in any session, on any account; `pytest -m no_position_without_its_exit` runs the set and `python -m canon_trading.exit_rule` prints each clause from it",
]
