# Codex CLI's native default model and reasoning effort (docs/adr/0059-native-defaults-for-every-runtime.md).
# scripts/bootstrap --user-config writes each key below that ${CODEX_HOME:-~/.codex}/config.toml lacks at the
# top of that file, where TOML keeps keys that belong to no table, and changes nothing else in it; a key the
# file already sets to another value is left as it is and named. Keys: `model` ("Model to use (e.g.,
# gpt-6.1-sol)") and `model_reasoning_effort` ("Reasoning effort advertised by the selected model"),
# https://learn.chatgpt.com/docs/config-file/config-reference. The values are the ones ADR 0045 rule 7 starts
# every Codex review with (`--model gpt-6.1-sol --effort max`), so a session started with no flags runs the
# same; canon/models.json's runtimes section names them and scripts/test-lanes holds the two together.
model = "gpt-6.1-sol"
model_reasoning_effort = "max"
