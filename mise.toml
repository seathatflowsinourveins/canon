# Pinned toolchain (docs/adr/0008-toolchain.md).
# `mise install` resolves these requests and records exact versions, download URLs and checksums in mise.lock.
# `mise install --locked` installs exactly what mise.lock records. Commit mise.lock.
# Syntax source: https://mise.jdx.dev/dev-tools/mise-lock.html

[settings]
lockfile = true

[tools]
python = "3.14"   # the pinned NautilusTrader release ships wheels for 3.13 and 3.14 only
uv = "0.13.7"     # canon/upstreams.json: uv
node = "24"       # runtime for `npx ccusage@20.0.48`
gh = "latest"     # GitHub CLI; the exact version is fixed in mise.lock at first install

# Quality tools that are not Python packages (docs/adr/0013-quality-gates.md). ruff and ty are Python
# packages and live in pyproject.toml's dev group instead, as NautilusTrader has them.
shellcheck = "0.11.0"   # canon/upstreams.json: shellcheck
gitleaks = "8.30.1"     # canon/upstreams.json: gitleaks
actionlint = "1.7.12"   # canon/upstreams.json: actionlint

# The Alpaca paper key pair (docs/adr/0029-paper-keys-in-the-login-keychain.md). Both values live in the
# macOS login keychain, one generic password item each, service "canon-alpaca-paper", account = the variable
# name. They are read only when `mise run paper:test` starts, into that task's own `env`, which mise renders
# when the task runs and not for `mise env`, `mise exec` or an activated shell (tested; ADR 0029). Nothing
# here holds a value. Sources: `man security` (add-, find-, delete-generic-password); mise's task `env` and
# `exec()` (https://mise.jdx.dev/tasks/task-configuration.html#env, https://mise.jdx.dev/templates.html).
# Task scripts are Tera templates too, so they must not contain "{{", "{%" or "{#".

[tasks."paper:store"]
description = "Enter the Alpaca paper key pair at a hidden prompt; store it only if Alpaca's paper API accepts it"
interactive = true
shell = "bash -c"
run = '''
set -euo pipefail
svc=canon-alpaca-paper
[ -t 0 ] || { echo "paper:store: needs a terminal to ask for the pair; run it in your own terminal" >&2; exit 1; }
for a in ALPACA_API_KEY ALPACA_SECRET_KEY; do
  if /usr/bin/security find-generic-password -s "$svc" -a "$a" >/dev/null 2>&1; then
    echo "paper:store: $a is already in the login keychain; run: mise run paper:remove" >&2; exit 1
  fi
done
read -rsp "Alpaca paper API key ID (hidden): " key; echo
read -rsp "Alpaca paper secret key (hidden): " secret; echo
if [ -z "$key" ] || [ -z "$secret" ]; then echo "paper:store: both values are needed; nothing stored" >&2; exit 1; fi
# Alpaca: "Live keys with an AK... prefix, these prefixes are visual hints" (alpaca.markets/learn,
# api-key-security-best-practices-for-alpaca-builders). A hint can refuse a key, never accept one.
case "$key" in AK*) echo "paper:store: refused. The key ID starts with AK, which Alpaca uses for live keys. Nothing stored." >&2; exit 1 ;; esac
# Alpaca: "you cannot use your live account's credentials with the paper API" (us/docs/authentication.md).
# The headers go to curl on stdin (-H @-), so neither value is in a command line.
code=$(printf 'APCA-API-KEY-ID: %s\nAPCA-API-SECRET-KEY: %s\n' "$key" "$secret" \
  | curl -sS -o /dev/null -w '%{http_code}' --max-time 20 -H @- https://paper-api.alpaca.markets/v2/account) || code="no answer"
case "$code" in
  200) ;;
  401|403) echo "paper:store: refused. Alpaca's paper API answered $code: this is not a working paper pair (a live pair is refused there). Nothing stored." >&2; exit 1 ;;
  *) echo "paper:store: could not check the pair (Alpaca's paper API: $code). Nothing stored; try again." >&2; exit 1 ;;
esac
# -w last, its value on stdin twice (the prompt and the retype), so it is in no command line or file.
store() { printf '%s\n%s\n' "$2" "$2" | /usr/bin/security add-generic-password -a "$1" -s "$svc" -l "Alpaca paper $1" -w >/dev/null 2>&1; }
same() { [ "$(/usr/bin/security find-generic-password -s "$svc" -a "$1" -w 2>/dev/null)" = "$2" ]; }
if store ALPACA_API_KEY "$key" && store ALPACA_SECRET_KEY "$secret" \
   && same ALPACA_API_KEY "$key" && same ALPACA_SECRET_KEY "$secret"; then
  echo "paper:store: Alpaca's paper API accepted the pair; stored ALPACA_API_KEY and ALPACA_SECRET_KEY in the login keychain (service $svc)"
else
  for a in ALPACA_API_KEY ALPACA_SECRET_KEY; do /usr/bin/security delete-generic-password -s "$svc" -a "$a" >/dev/null 2>&1 || true; done
  echo "paper:store: storing failed or read back differently; both items removed, nothing kept" >&2
  exit 1
fi
'''

[tasks."paper:check"]
description = "Say whether both paper keychain items exist, without reading either value"
shell = "bash -c"
run = '''
missing=0
for a in ALPACA_API_KEY ALPACA_SECRET_KEY; do
  if /usr/bin/security find-generic-password -s canon-alpaca-paper -a "$a" >/dev/null 2>&1; then echo "$a: in the login keychain"
  else echo "$a: absent"; missing=1; fi
done
exit "$missing"
'''

[tasks."paper:remove"]
description = "Delete both paper keychain items"
shell = "bash -c"
run = '''
for a in ALPACA_API_KEY ALPACA_SECRET_KEY; do
  if /usr/bin/security delete-generic-password -s canon-alpaca-paper -a "$a" >/dev/null 2>&1; then echo "$a: removed"
  else echo "$a: was not there"; fi
done
'''

[tasks."paper:test"]
description = "Run the two paper tests with the key pair read from the login keychain for this task only"
env.ALPACA_API_KEY = { value = "{{ exec(command='/usr/bin/security find-generic-password -s canon-alpaca-paper -a ALPACA_API_KEY -w') }}", redact = true }
env.ALPACA_SECRET_KEY = { value = "{{ exec(command='/usr/bin/security find-generic-password -s canon-alpaca-paper -a ALPACA_SECRET_KEY -w') }}", redact = true }
# An empty value would make both tests skip and the task pass, so it is refused first.
run = '''
[ -n "$ALPACA_API_KEY" ] && [ -n "$ALPACA_SECRET_KEY" ] || { echo "paper:test: a keychain item is empty; run: mise run paper:remove, then mise run paper:store" >&2; exit 1; }
uv run --locked pytest -rs packages/canon-alpaca/tests/test_paper_integration.py packages/canon-alpaca/tests/test_paper_execution.py
'''
