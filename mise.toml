# Pinned toolchain (docs/adr/0008-toolchain.md).
# `mise install` resolves these requests and records exact versions, download URLs and checksums in mise.lock.
# `mise install --locked` installs exactly what mise.lock records. Commit mise.lock.
# Syntax source: https://mise.jdx.dev/dev-tools/mise-lock.html

[settings]
lockfile = true

[tools]
python = "3.14"   # the pinned NautilusTrader release ships wheels for 3.13 and 3.14 only
uv = "0.13.7"     # canon/upstreams.json: uv
node = "24"       # runtime for `npx ccusage@20.0.49`
gh = "latest"     # GitHub CLI; the exact version is fixed in mise.lock at first install

# Quality tools that are not Python packages (docs/adr/0013-quality-gates.md). ruff and ty are Python
# packages and live in pyproject.toml's dev group instead, as NautilusTrader has them.
shellcheck = "0.11.0"   # canon/upstreams.json: shellcheck
gitleaks = "8.30.1"     # canon/upstreams.json: gitleaks
actionlint = "1.7.12"   # canon/upstreams.json: actionlint

# The OpenTelemetry Collector, core distribution (docs/adr/0007-observability.md, tier 3). Neither the mise nor
# the aqua registry has it, so it comes from its GitHub releases through mise's github: backend; each release
# ships several distributions per platform, and `matching` keeps the core one's archives (otelcol_<version>_
# <os>_<arch>.tar.gz), as https://mise.jdx.dev/dev-tools/backends/github.html advises for a release that ships
# several tools. canon/upstreams.json: otelcol
"github:open-telemetry/opentelemetry-collector-releases" = { version = "0.165.0", matching = "otelcol_", bin = "otelcol" }

# The Alpaca paper key pair (docs/adr/0029-paper-keys-in-the-login-keychain.md). Both values live in the
# macOS login keychain, one generic password item each, service "canon-alpaca-paper", account = the variable
# name. They are read only when `mise run paper:test` starts, into that task's own `env`, which mise renders
# when the task runs and not for `mise env`, `mise exec` or an activated shell (tested; ADR 0029). Nothing
# here holds a value. Sources: `man security` (add-, find-, delete-generic-password); mise's task `env` and
# `exec()` (https://mise.jdx.dev/tasks/task-configuration.html#env, https://mise.jdx.dev/templates.html).
# Task scripts are Tera templates too, so they must not contain "{{", "{%" or "{#".
# Two paper accounts (docs/adr/0069-two-paper-accounts.md): `tests`, account A, the service above, and
# `windows`, account B, service "canon-alpaca-paper-windows", the same two item names. A third on ADR 0069's
# pattern (the owner's requirement, 2026-11-12): `protect`, account C, service "canon-alpaca-paper-protect",
# which paper:store, paper:check, paper:remove and paper:account take, and paper:protect protect, the one task
# that sends an order on it: a trailing stop for a long it finds, or that stop's cancel (ADR 0142).
# paper:store, paper:check
# and paper:remove take the account as an argument, `tests` when none is given; mise refuses any other name
# before the script starts (the `usage` spec's `choices`, https://mise.jdx.dev/tasks/task-arguments.html,
# tried with mise 2026.11.5), and each script's `case` refuses it again. paper:test reads account A's pair and
# paper:session, by hand or from the schedule, account B's; neither reads the other's. Each account has its own
# lock, canon-paper-test.lock for A, canon-paper-windows.lock for B and canon-paper-protect.lock for C, so a
# test and a window do not wait for each other. Each account's pair has its own market-data stream lock as well, taken last by whatever opens a
# stream on that pair (ADR 0069, 2026-11-11: two pairs of one login each held a subscribed connection at
# once): canon-alpaca-stream-tests.lock for A's pair, taken by each paper test that streams, from its fixture,
# and by paper:data's streaming modules; canon-alpaca-stream-windows.lock for B's, taken by a window after its
# sync. A stream wait polls lockf(1) -t 0 once a second, since lockf's own -t on a descriptor spins a core
# while it waits (ADR 0065, 2026-11-11).

[tasks."paper:store"]
description = "Enter an Alpaca paper account's key pair at a hidden prompt; store it only if Alpaca's paper API accepts it"
interactive = true
shell = "bash -c"
usage = '''
arg "[account]" help="tests: account A, the default, which paper:test reads; windows: account B, which paper:session reads; protect: account C (ADR 0069's pattern)" default="tests" {
  choices "tests" "windows" "protect"
}
'''
run = '''
set -euo pipefail
# the account (ADR 0069's pattern): its service, the two others', its items' label, and the argument that names it
case "${usage_account:-tests}" in
  tests) svc=canon-alpaca-paper; others="canon-alpaca-paper-windows canon-alpaca-paper-protect"; label=Alpaca-paper; arg="" ;;
  windows) svc=canon-alpaca-paper-windows; others="canon-alpaca-paper canon-alpaca-paper-protect"; label=Alpaca-paper-windows; arg=" windows" ;;
  protect) svc=canon-alpaca-paper-protect; others="canon-alpaca-paper canon-alpaca-paper-windows"; label=Alpaca-paper-protect; arg=" protect" ;;
  *) echo "paper:store: no paper account named ${usage_account}; the names are tests, windows and protect. Nothing stored." >&2; exit 1 ;;
esac
[ -t 0 ] || { echo "paper:store: needs a terminal to ask for the pair; run it in your own terminal" >&2; exit 1; }
# Exit statuses: 0 found, 44 absent (errSecItemNotFound, observed; ADR 0029). security documents none, and
# 44 is that status's low byte, so another error ending in the same byte would read as absent. Any other
# failure stops the task: read as absent, it went on to an add that failed and a rollback that deleted the
# pair already stored (a second reader's review).
for a in ALPACA_API_KEY ALPACA_SECRET_KEY; do
  rc=0; /usr/bin/security find-generic-password -s "$svc" -a "$a" >/dev/null 2>&1 || rc=$?
  case "$rc" in
    44) ;;
    0) echo "paper:store: $a is already in the login keychain (service $svc); run: mise run paper:remove$arg" >&2; exit 1 ;;
    *) echo "paper:store: could not check whether $a is in the login keychain (security exit $rc); nothing stored" >&2; exit 1 ;;
  esac
done
# No two accounts hold one pair (ADR 0069): each other account's stored key ID, compared below with the
# one entered. They are read here, before either prompt, so a failure stops the task before anything is typed,
# and under timeout(1) for 30 s, as paper:test's reads are, so a read waiting at a dialog does not hold it
# (exit 124). security writes each to a pipe into this shell; no secret is read. 44: none stored there, kept
# as an empty entry, which no key ID entered can equal (an empty one is refused before the comparison).
okeys=()
for other in $others; do
  orc=0; okey=$(/usr/bin/timeout 30 /usr/bin/security find-generic-password -s "$other" -a ALPACA_API_KEY -w 2>/dev/null) || orc=$?
  case "$orc" in
    0) okeys+=("$okey") ;;
    44) okeys+=("") ;;
    *) okey=""; echo "paper:store: could not read the other paper account's key ID to compare (security exit $orc, 124 if no answer in 30 s) from service $other; nothing stored" >&2; exit 1 ;;
  esac
done
okey=""
# Echo off before either prompt shows: a silent read turns it off only after its prompt, so a value typed
# or pasted at once could show (observed with bash 3.2; ADR 0033). It is back on however the task ends.
trap 'stty echo' EXIT; trap 'exit 130' INT TERM HUP; stty -echo
read -rsp "Alpaca paper API key ID (hidden): " key; echo
read -rsp "Alpaca paper secret key (hidden): " secret; echo
stty echo
if [ -z "$key" ] || [ -z "$secret" ]; then echo "paper:store: both values are needed; nothing stored" >&2; exit 1; fi
# Alpaca: "Live keys with an AK... prefix, these prefixes are visual hints" (alpaca.markets/learn,
# api-key-security-best-practices-for-alpaca-builders). A hint can refuse a key, never accept one.
case "$key" in AK*) echo "paper:store: refused. The key ID starts with AK, which Alpaca uses for live keys. Nothing stored." >&2; exit 1 ;; esac
# Two equal pairs have equal key IDs, so a key ID equal to one stored for another account is refused, before
# the paper API is asked. bash's `[`, a builtin, compares them, so neither value is in a process's arguments.
i=0
for other in $others; do
  if [ -n "${okeys[$i]}" ] && [ "${okeys[$i]}" = "$key" ]; then
    okeys=(); echo "paper:store: refused. This key ID is the one stored for the other paper account (service $other); each account has its own pair. Nothing stored." >&2; exit 1
  fi
  i=$((i + 1))
done
okeys=()
# Alpaca: "you cannot use your live account's credentials with the paper API" (us/docs/authentication.md).
# The headers go to curl on stdin (-H @-), so neither value is in a command line. -q first: curl reads no
# curlrc ("unless -q, --disable is used", curl(1)). That is all -q does: a proxy named in the environment
# and the curl first on PATH still apply (ADR 0114 records it as a limit).
code=$(printf 'APCA-API-KEY-ID: %s\nAPCA-API-SECRET-KEY: %s\n' "$key" "$secret" \
  | curl -q -sS -o /dev/null -w '%{http_code}' --max-time 20 -H @- https://paper-api.alpaca.markets/v2/account) || code="no answer"
case "$code" in
  200) ;;
  401|403) echo "paper:store: refused. Alpaca's paper API answered $code: this is not a working paper pair (a live pair is refused there). Nothing stored." >&2; exit 1 ;;
  *) echo "paper:store: could not check the pair (Alpaca's paper API: $code). Nothing stored; try again." >&2; exit 1 ;;
esac
# Not `-w` last: on a terminal security prompts there and never reads a pipe (ADR 0033). `security -i` takes
# commands on stdin and -X the value as hex (man security), so security parses only [0-9a-f] for it, and the
# value is in no process's arguments and no file: printf is bash's own, and od reads the value on stdin.
store() {
  local hex
  hex=$(printf '%s' "$2" | od -An -tx1 | tr -dc 0-9a-f)
  printf 'add-generic-password -a %s -s %s -l %s-%s -X %s\n' "$1" "$svc" "$label" "$1" "$hex" | /usr/bin/security -i >/dev/null 2>&1
}
same() { [ "$(/usr/bin/security find-generic-password -s "$svc" -a "$1" -w 2>/dev/null)" = "$2" ]; }
if store ALPACA_API_KEY "$key" && store ALPACA_SECRET_KEY "$secret" \
   && same ALPACA_API_KEY "$key" && same ALPACA_SECRET_KEY "$secret"; then
  echo "paper:store: Alpaca's paper API accepted the pair; stored ALPACA_API_KEY and ALPACA_SECRET_KEY in the login keychain (service $svc)"
else
  # 44 (absent, as above) is an item that was not stored; any other failure leaves one that may be (a second
  # reader's claim: it said both were removed whatever the deletions answered)
  left=""
  for a in ALPACA_API_KEY ALPACA_SECRET_KEY; do
    rc=0; /usr/bin/security delete-generic-password -s "$svc" -a "$a" >/dev/null 2>&1 || rc=$?
    [ "$rc" = 0 ] || [ "$rc" = 44 ] || left="$left, could not remove $a (security exit $rc)"
  done
  if [ -n "$left" ]; then echo "paper:store: storing failed or read back differently${left}; run: mise run paper:remove$arg" >&2
  else echo "paper:store: storing failed or read back differently; nothing kept (each item removed or never stored)" >&2; fi
  exit 1
fi
'''

[tasks."paper:check"]
description = "Say whether both keychain items of a paper account exist, without reading either value"
shell = "bash -c"
usage = '''
arg "[account]" help="tests: account A, the default, which paper:test reads; windows: account B, which paper:session reads; protect: account C (ADR 0069's pattern)" default="tests" {
  choices "tests" "windows" "protect"
}
'''
run = '''
case "${usage_account:-tests}" in
  tests) svc=canon-alpaca-paper ;;
  windows) svc=canon-alpaca-paper-windows ;;
  protect) svc=canon-alpaca-paper-protect ;;
  *) echo "paper:check: no paper account named ${usage_account}; the names are tests, windows and protect" >&2; exit 3 ;;
esac
echo "paper account ${usage_account:-tests}, service $svc:"
# exit 0 when both are there, 1 when one is absent (44, as paper:store reads it), 2 when security failed
# otherwise, which says nothing about whether the item is there (a locked keychain, a refused access), and 3
# when the account named is none of the three (ADR 0069's pattern)
missing=0
for a in ALPACA_API_KEY ALPACA_SECRET_KEY; do
  rc=0; /usr/bin/security find-generic-password -s "$svc" -a "$a" >/dev/null 2>&1 || rc=$?
  if [ "$rc" = 0 ]; then echo "$a: in the login keychain"
  elif [ "$rc" = 44 ]; then echo "$a: absent"; [ "$missing" = 2 ] || missing=1
  else echo "$a: could not be checked (security exit $rc)"; missing=2; fi
done
exit "$missing"
'''

[tasks."paper:remove"]
description = "Delete both keychain items of a paper account"
shell = "bash -c"
usage = '''
arg "[account]" help="tests: account A, the default, which paper:test reads; windows: account B, which paper:session reads; protect: account C (ADR 0069's pattern)" default="tests" {
  choices "tests" "windows" "protect"
}
'''
run = '''
case "${usage_account:-tests}" in
  tests) svc=canon-alpaca-paper ;;
  windows) svc=canon-alpaca-paper-windows ;;
  protect) svc=canon-alpaca-paper-protect ;;
  *) echo "paper:remove: no paper account named ${usage_account}; the names are tests, windows and protect. Nothing removed." >&2; exit 1 ;;
esac
echo "paper account ${usage_account:-tests}, service $svc:"
# 44 is an absent item (as paper:store reads it; scripts/test-lanes observes it for a deletion too); any other
# failure leaves the item where it was, and the task fails
failed=0
for a in ALPACA_API_KEY ALPACA_SECRET_KEY; do
  rc=0; /usr/bin/security delete-generic-password -s "$svc" -a "$a" >/dev/null 2>&1 || rc=$?
  if [ "$rc" = 0 ]; then echo "$a: removed"
  elif [ "$rc" = 44 ]; then echo "$a: was not there"
  else echo "$a: could not be removed (security exit $rc)"; failed=1; fi
done
exit "$failed"
'''

# The paper lock's owner has a deadline (both paper tasks). The task opens the lock file on descriptor 9 and
# locks that descriptor (lockf(1), "Protect a section of a shell script with a lock"), so every process the
# task starts inherits the lock and it is free only once the last of them has ended. Then `bounded` runs uv
# under timeout(1) -s KILL, its `deadline` less the time already spent: timeout "makes itself the leader of a
# process group that the command inherits and sends the signal to that process group", so at the deadline
# uv, Python and every process they started (one that ignores SIGTERM included, unless it left the group with
# setsid(2)) end together and the lock is free. SIGKILL, not SIGTERM first: timeout(1) and mise's own task
# `timeout` (SIGTERM, then SIGKILL 5 s later, mise docs, tasks/task-configuration) both stop waiting once
# their direct child has exited, and a descendant that ignored SIGTERM then kept the lock (scripts/test-lanes,
# "paper lock deadline"); Python's default SIGTERM action ends it without running `finally` either. For the
# same reason a stop before the deadline must not leave the group to timeout(1): a SIGTERM to mise, which
# passes it to the task, or to timeout itself, which propagates it to the group (timeout(1)), ended uv, and
# timeout exited with it while a child that ignored SIGTERM kept the lock past the deadline (observed). So
# the task's shell stays, waits for timeout, and on a TERM, HUP or INT, and again once timeout has exited,
# sends SIGKILL to the whole group (kill(1), a negative pid). mise runs the task in a process group of its
# own (observed with mise 2026.11.5), so the runner's bound on `mise run` ends mise and leaves the task and
# its deadline as they were. mise appends a task's arguments to the last line of its script (observed), so
# that line calls the function that runs uv with "$@". mise's `timeout`, 60 s later than `deadline`, stays as
# the bound on the task's own body, and is the deadline of a run from a person's terminal (stdin a
# terminal): there uv runs in the terminal's process group as before, since one Ctrl-C reached Python twice
# through timeout(1) and mise (observed), and a second interrupt would cut a window's flatten or a test's
# cleanup short; a person is there to see a hang. Each keychain read runs under timeout(1) for 30 s: mise
# renders the env before the task's `timeout` starts (observed with mise 2026.11.5), and a read waiting at a
# dialog no one sees would hold the firing.
[tasks."paper:test"]
description = "Run every paper test with the key pair read from the login keychain for this task only"
# its 3900 s wait for account A's lock, then 55 minutes for tests that take about five (observed); deadline 60 s
# inside. A streaming test may also wait for the stream lock, at most until 900 s are left before the deadline
# (ADR 0050)
timeout = "2h"
env.ALPACA_API_KEY = { value = "{{ exec(command='/usr/bin/timeout 30 /usr/bin/security find-generic-password -s canon-alpaca-paper -a ALPACA_API_KEY -w') }}", redact = true }
env.ALPACA_SECRET_KEY = { value = "{{ exec(command='/usr/bin/timeout 30 /usr/bin/security find-generic-password -s canon-alpaca-paper -a ALPACA_SECRET_KEY -w') }}", redact = true }
# An empty value would make every paper test skip and the task pass, so it is refused first.
run = '''
deadline=7140
lockwait=3900
start=$(/bin/date +%s)
[ -n "$ALPACA_API_KEY" ] && [ -n "$ALPACA_SECRET_KEY" ] || { echo "paper:test: a keychain item of account A is empty; run: mise run paper:remove, then mise run paper:store" >&2; exit 1; }
# Account A serves the paper tests and nothing else (ADR 0069), so the run holds account A's lock throughout
# and a second run waits for it, at most `lockwait` seconds, then fails without placing anything (lockf(1);
# the file is kept, as a descriptor implies and lockf(1) advises when processes contend). No window takes
# this lock: windows run on account B under its own, and stream on B's pair under B's stream lock. Each paper
# test that opens a stream (the `alpaca_stream` marker) takes account A's stream lock, named below, from its
# fixture, waiting as long as this wait; paper:data's streaming modules, on A's pair too, take the same lock. The locks are in the per-user temporary folder,
# which is the same for every process of the user whatever $TMPDIR a session sets.
# Descriptor 9 and the deadline: the note above this task.
# the folder's name, or a stop: none would leave a lock file of this run's own, beside no other run's
# (scripts/test-lanes, "per-user temporary folder")
tmp="$(/usr/bin/getconf DARWIN_USER_TEMP_DIR)" || tmp=""
case "$tmp" in /*/) ;; *) echo "paper:test: the per-user temporary folder is not known (DARWIN_USER_TEMP_DIR gave '$tmp'), so there is no paper lock to take; nothing was placed" >&2; exit 1 ;; esac
# lock_wait <fd> <secs>: the exclusive lock on an open descriptor, waiting at most <secs>; 0 when held, 1 when the
# bound ran out (a bound can run over by up to a second), or at once when lockf fails for any reason but the
# lock being held (exit 75, EX_TEMPFAIL). lockf(1)'s descriptor form (`lockf -t <secs> <fd>`, man lockf) busy-loops while it waits, about
# 71% of a core after 6 s (measured on this Mac), so this polls `lockf -t 0 <fd>`, which fails unless it can
# take the lock at once, with a one-second sleep: about no CPU. The lock belongs to the open file description,
# so every process the task starts still inherits it (the note above paper:test). The same text is in every
# paper task that waits for a lock (scripts/test-lanes checks that).
lock_wait() {
  lw_end=$(( $(/bin/date +%s) + $2 ))
  while :; do
    /usr/bin/lockf -t 0 "$1" 2>/dev/null; lw_rc=$?
    [ "$lw_rc" = 0 ] && return 0
    [ "$lw_rc" = 75 ] || return 1
    [ "$(/bin/date +%s)" -lt "$lw_end" ] || return 1
    sleep 1
  done
}
exec 9>>"${tmp}canon-paper-test.lock"
lock_wait 9 "$lockwait" || { echo "paper:test: account A's lock stayed held for $lockwait s; nothing was placed" >&2; exit 1; }
# account A's stream lock's path, and the deadline's epoch second, so a streaming test waits for the lock only while
# TEST_ROOM_SECS would be left (the conftests' stream-lock block)
export CANON_ALPACA_STREAM_LOCK="${tmp}canon-alpaca-stream-tests.lock" CANON_PAPER_TEST_DEADLINE=$((start + deadline))
# bounded <secs> <command...>: the command under timeout(1) -s KILL, in the process group timeout leads, with
# its whole group killed on a stop and once it ends (the note above paper:test). With `stopgrace` set, a stop is
# first passed on as SIGTERM to timeout, which passes a signal it gets to its group (`man timeout`), and the
# group gets `stopgrace` s to end before the kill, so a window's own stop and wind-down run (session_window,
# `STOP_GRACE_SECS`); further stops are ignored meanwhile, and nothing is started to time the grace.
bounded() {
  b=$1; shift; g=""; stopping=""
  # traps first, so a stop at any point after this ends what has started; `g` is timeout's pid, and its group's
  stop() {
    # a stop while one is under way is only noted: the traps stay as they are, since /bin/sh (bash 3.2) kills
    # itself with a trap changed from inside that trap ("run_pending_traps: bad value", seen 2026-11-12)
    [ -z "$stopping" ] || return 0; stopping=1
    if [ -n "$g" ] && [ -n "${stopgrace:-}" ]; then
      kill -TERM "$g" 2>/dev/null || :
      # until timeout has ended: gone, or its zombie (ps STAT Z), which `kill -0` would count as running
      se=$(( $(/bin/date +%s) + stopgrace ))
      while [ "$(/bin/date +%s)" -lt "$se" ]; do
        case "$(/bin/ps -o stat= -p "$g" 2>/dev/null)" in ""|Z*) break ;; esac
        sleep 1
      done
    fi
    [ -z "$g" ] || kill -s KILL -- "-$g" 2>/dev/null || kill -KILL "$g" 2>/dev/null; exit "$1"
  }
  trap 'stop 143' TERM; trap 'stop 129' HUP; trap 'stop 130' INT
  /usr/bin/timeout -s KILL "$b" "$@" & g=$!
  rc=0; wait "$g" || rc=$?
  # what of the group outlived timeout; the group's id is timeout's pid, which the system does not hand out
  # again at once (a group left empty is gone, and the kill finds nothing)
  kill -s KILL -- "-$g" 2>/dev/null || :
  trap - TERM HUP INT
  return "$rc"
}
tests() {
  left=$((deadline - ($(/bin/date +%s) - start)))
  [ "$left" -gt 0 ] || { echo "paper:test: no time left before the deadline" >&2; exit 1; }
  [ ! -t 0 ] || exec uv run --locked pytest -rs packages/canon-alpaca/tests/test_paper_*.py tests/test_paper_*.py "$@"
  bounded "$left" uv run --locked pytest -rs packages/canon-alpaca/tests/test_paper_*.py tests/test_paper_*.py "$@"
}
tests
'''

# One window of the session run (docs/adr/0044-paper-session-windows-for-macross.md, which supersedes ADR
# 0029's "only paper:test" clause: this task, too, reads a pair into its own env), on paper account B, service
# canon-alpaca-paper-windows, and no other (ADR 0069). It waits for account B's lock, which only another window
# takes, and holds it for the window; then, after uv's sync, for account B's market-data stream lock, which
# only a window takes; the two waits share `lockwait`. It holds both for the window,
# at most `session_window.LONGEST_WINDOW_SECS` plus start-up and the bounded end; the window flattens and
# checks the account before it ends. Arguments go to
# `python -m canon_trading.session_window` (--session regular|extended|auto, --strategy SessionMaCross, the
# default; EmaCross is refused by name for selling while flat, --minutes, --symbol). A window starts only on an
# account Alpaca holds long-only (paper:long-only). Its log and
# report are in the per-user temporary folder, outside the repository, canon-paper-session/, with the gap
# marker every run reads. Its records (latest.json, window-*.json, last-firing.json) are there for the
# scheduled runner's run (CANON_PAPER_SCHEDULED=1, or CANON_COMMIT), which `scripts/automation status` reads,
# and in by-hand/ for a run by hand (CANON_PAPER_BY_HAND=1), so a run by hand never changes the schedule's row. Run
# by the scheduled runner (CANON_COMMIT set), `--exact` makes its clone's kept .venv exactly uv.lock, as
# `uv sync` would; a run by hand leaves the worktree's .venv as it is (uv run's inexact default; ADR 0050).
# A run the schedule started reads the schedule's switch first, canon/paper-schedule, and takes no lock and
# places nothing unless it says to (`scheduled` in the body; ADR 0050).
[tasks."paper:session"]
description = "Run one bounded SessionMaCross window on paper account B, which Alpaca holds long-only, under its lock and the stream lock"
# deadline: its 900 s wait for the two locks, the start-up (uv's sync, held to `sync`, then the imports before the
# first clock read), the window's longest and its bounded end (the arithmetic is ADR 0050's, and
# tests/test_session_window.py holds it); a window stopped there is recorded `running` and so shows as died, and the next one starts only
# once the account is flat. Descriptor 9 and the deadline: the note above paper:test.
timeout = "105m"
env.ALPACA_API_KEY = { value = "{{ exec(command='/usr/bin/timeout 30 /usr/bin/security find-generic-password -s canon-alpaca-paper-windows -a ALPACA_API_KEY -w') }}", redact = true }
env.ALPACA_SECRET_KEY = { value = "{{ exec(command='/usr/bin/timeout 30 /usr/bin/security find-generic-password -s canon-alpaca-paper-windows -a ALPACA_SECRET_KEY -w') }}", redact = true }
env.CANON_PAPER_ACCOUNT = "windows"  # the account's name for the window records (ADR 0069); never a key
run = '''
deadline=6240
sync=600
lockwait=900
# gap: session_window.GAP_SECS, the least time between a window's end and the next one's start (ADR 0044)
gap=60
# grace: how long a stop gives the window's wind-down before its group is killed (session_window.STOP_GRACE_SECS)
grace=785
start=$(/bin/date +%s)
tmp="$(/usr/bin/getconf DARWIN_USER_TEMP_DIR)" || tmp=""
case "$tmp" in /*/) ;; *) echo "paper:session: the per-user temporary folder is not known (DARWIN_USER_TEMP_DIR gave '$tmp'), so there is no paper lock or log folder; nothing was placed" >&2; exit 1 ;; esac
# a run the runner started (CANON_COMMIT) is the schedule's unless the runner itself says by hand, so a
# runner installed before CANON_PAPER_SCHEDULED existed still writes the records status reads
[ "${CANON_PAPER_SCHEDULED:-}" = 1 ] || [ -n "${CANON_COMMIT:-}" ] || export CANON_PAPER_BY_HAND=1
waited=0
# heard <exit code> <outcome>: say what a scheduled firing came to before any lock, write it as the heartbeat
# `scripts/automation status` reads (last-firing.json, the fields canon_trading.session_window.write_heartbeat
# writes; the commit is "none: nothing ran", as the runner writes for a firing that ran nothing, so status does
# not count it as a run that held the lock) through a file of its own (mktemp(1)), and exit. A heartbeat that
# cannot be written is said on stderr and the outcome's exit code stands, as the window's own does (`_heard`).
heard() {
  if [ "$1" = 0 ]; then echo "paper:session: $2"; else echo "paper:session: $2" >&2; fi
  d="${tmp}canon-paper-session"; t=""
  # not onto a directory of that name, which mv would move the file into
  if [ ! -d "$d/last-firing.json" ] && /bin/mkdir -p "$d" && t=$(/usr/bin/mktemp "$d/.last-firing.json.XXXXXX") \
     && printf '{"at_epoch": %s, "outcome": "%s", "commit": "none: nothing ran", "scheduled": true}\n' "$(/bin/date +%s)" "$2" > "$t" \
     && /bin/mv -f "$t" "$d/last-firing.json"; then :
  else
    [ -z "$t" ] || /bin/rm -f "$t"
    echo "paper:session: the heartbeat could not be written in $d" >&2
  fi
  exit "$1"
}
# scheduled <arguments...>: the schedule's switch, the first line of canon/paper-schedule in the tree this task
# runs from, which for a scheduled firing is the main it has just cloned (ADR 0050): so a landing on main turns
# the schedule off or on at the next firing, with nothing to install. Read before any lock is taken. `off`: the
# firing skips by name, exit 0. `mover`: it goes on only with --mover among its arguments, and one without (a
# plist installed before main's) is refused by name. Anything else fails by name: the first line is the value
# and nothing else, and scripts/test-lanes reads the tracked file the same way, so one that would fail every
# firing does not pass the checks. A run by hand reads none of it. The outcomes hold no double quote or
# backslash: heard writes them into JSON as they are. It is read before the pair is looked at, so an empty
# keychain item does not turn a skip into a failure; mise has rendered the task's env by then, the two
# keychain reads included, which only a check in the installed runner would spare (a limit ADR 0050 records).
# (mise's own `skip_if`, a command whose exit 0 skips a task, only skips: mise's task configuration page, read
# 2026-11-11 through a summary.)
scheduled() {
  [ -z "${CANON_PAPER_BY_HAND:-}" ] || return 0
  schedule=""
  if [ -f canon/paper-schedule ]; then read -r schedule < canon/paper-schedule || :; fi
  case "$schedule" in
    off) heard 0 "skipped: the schedule is off (canon/paper-schedule); nothing was placed" ;;
    mover)
      for a in "$@"; do [ "$a" != --mover ] || return 0; done
      heard 1 "refused: the schedule is the mover's (canon/paper-schedule) and this firing carries no --mover, so its plist is older than main (scripts/automation install); nothing was placed" ;;
    *) heard 1 "failed: canon/paper-schedule's first line is neither off nor mover; nothing was placed" ;;
  esac
}
# lock_wait <fd> <secs>: the exclusive lock on an open descriptor, waiting at most <secs>; 0 when held, 1 when the
# bound ran out (a bound can run over by up to a second), or at once when lockf fails for any reason but the
# lock being held (exit 75, EX_TEMPFAIL). lockf(1)'s descriptor form (`lockf -t <secs> <fd>`, man lockf) busy-loops while it waits, about
# 71% of a core after 6 s (measured on this Mac), so this polls `lockf -t 0 <fd>`, which fails unless it can
# take the lock at once, with a one-second sleep: about no CPU. The lock belongs to the open file description,
# so every process the task starts still inherits it (the note above paper:test). The same text is in every
# paper task that waits for a lock (scripts/test-lanes checks that).
lock_wait() {
  lw_end=$(( $(/bin/date +%s) + $2 ))
  while :; do
    /usr/bin/lockf -t 0 "$1" 2>/dev/null; lw_rc=$?
    [ "$lw_rc" = 0 ] && return 0
    [ "$lw_rc" = 75 ] || return 1
    [ "$(/bin/date +%s)" -lt "$lw_end" ] || return 1
    sleep 1
  done
}
# gapwait: what is left of `gap` since the last window's end, from the marker session_window writes in its log
# folder (last-window-end), slept out of what is left of `lockwait`; the window's own check still decides. So a
# run that waited for account B's lock as the window before it ended takes its turn rather than reaching that
# check and skipping (ADR 0050, 2026-11-13). File time: GNU stat -c %Y, else BSD stat -f %m (stat(1) on each)
gapwait() {
  m="${tmp}canon-paper-session/last-window-end"
  [ -f "$m" ] || return 0
  e=$(/usr/bin/stat -c %Y "$m" 2>/dev/null || /usr/bin/stat -f %m "$m" 2>/dev/null) || return 0
  case "$e" in ''|*[!0-9]*) return 0 ;; esac
  g=$((gap - ($(/bin/date +%s) - e) + 1)); s=$((lockwait - waited))
  [ "$g" -le "$s" ] || g=$s
  [ "$g" -gt 0 ] || return 0
  echo "paper:session: waiting $g s for the gap after the last window's end"
  sleep "$g"
  waited=$(( $(/bin/date +%s) - start ))
}
# stream: account B's market-data stream lock (ADR 0069), on descriptor 7 (the runner's checkout lock is 8),
# for what is left of `lockwait`, by lock_wait; taken after uv's sync, so a window holds it only while its
# process runs
stream() {
  s=$((lockwait - waited)); [ "$s" -ge 0 ] || s=0
  exec 7>>"${tmp}canon-alpaca-stream-windows.lock"
  lock_wait 7 "$s" || { echo "paper:session: the market-data stream lock stayed held ($lockwait s for both locks); nothing was placed" >&2; exit 1; }
}
# bounded <secs> <command...>: the command under timeout(1) -s KILL, in the process group timeout leads, with
# its whole group killed on a stop and once it ends (the note above paper:test). With `stopgrace` set, a stop is
# first passed on as SIGTERM to timeout, which passes a signal it gets to its group (`man timeout`), and the
# group gets `stopgrace` s to end before the kill, so a window's own stop and wind-down run (session_window,
# `STOP_GRACE_SECS`); further stops are ignored meanwhile, and nothing is started to time the grace.
bounded() {
  b=$1; shift; g=""; stopping=""
  # traps first, so a stop at any point after this ends what has started; `g` is timeout's pid, and its group's
  stop() {
    # a stop while one is under way is only noted: the traps stay as they are, since /bin/sh (bash 3.2) kills
    # itself with a trap changed from inside that trap ("run_pending_traps: bad value", seen 2026-11-12)
    [ -z "$stopping" ] || return 0; stopping=1
    if [ -n "$g" ] && [ -n "${stopgrace:-}" ]; then
      kill -TERM "$g" 2>/dev/null || :
      # until timeout has ended: gone, or its zombie (ps STAT Z), which `kill -0` would count as running
      se=$(( $(/bin/date +%s) + stopgrace ))
      while [ "$(/bin/date +%s)" -lt "$se" ]; do
        case "$(/bin/ps -o stat= -p "$g" 2>/dev/null)" in ""|Z*) break ;; esac
        sleep 1
      done
    fi
    [ -z "$g" ] || kill -s KILL -- "-$g" 2>/dev/null || kill -KILL "$g" 2>/dev/null; exit "$1"
  }
  trap 'stop 143' TERM; trap 'stop 129' HUP; trap 'stop 130' INT
  /usr/bin/timeout -s KILL "$b" "$@" & g=$!
  rc=0; wait "$g" || rc=$?
  # what of the group outlived timeout; the group's id is timeout's pid, which the system does not hand out
  # again at once (a group left empty is gone, and the kill finds nothing)
  kill -s KILL -- "-$g" 2>/dev/null || :
  trap - TERM HUP INT
  return "$rc"
}
# kept [logs]: copy the window records out of the temp folder, which a restart empties, into
# <config>/canon/watch/windows/, beside the runner's log (CLAUDE_CONFIG_DIR, else ~/.claude, as scripts/automation
# names it): every window-*.json here and in by-hand/. With `logs`, each window-*.log of 1 MB or less too: only
# once the window's process group has ended, at its end or after a stop (the task's EXIT trap, which runs after
# bounded has waited for or killed the group), with account B's lock still held, so a log is copied once no
# process writes it. Those two copies hold the lock, on a stop too, for at most 40 s more, and the loop after
# them for as long as it takes to read the logs not yet kept (0.16 s for a 50 MB log, measured 2026-11-13). The tool is macOS's
# /usr/bin/rsync (openrsync; `man rsync` here: -a, --include, --exclude, --max-size), which copies only what is
# not there yet or has changed, so a run that ended before its copy is caught by the next; each call is held to
# 20 s. The patterns are anchored to those two levels. A log that rsync leaves (over its bound, which openrsync
# reads as 1048576 bytes, or a run that failed) is not dropped: a whole copy of at most 1024000 bytes is kept, a larger log's first and last
# 512000 bytes with a line between them naming its bytes, its lines and those left out; when that copy cannot
# be made, a line on stderr names the file and its size. A copy that fails is said on stderr and changes no
# exit code; nothing here is read by status or by a window.
kept() {
  k="${CLAUDE_CONFIG_DIR:-$HOME/.claude}/canon/watch/windows"
  [ -d "${tmp}canon-paper-session" ] || return 0
  { /bin/mkdir -p "$k" \
    && /usr/bin/timeout 20 /usr/bin/rsync -a --include='/window-*.json' --include='/by-hand/' --include='/by-hand/window-*.json' --exclude='*' "${tmp}canon-paper-session/" "$k/"; } \
    || echo "paper:session: the window records could not be copied to $k; they are still in ${tmp}canon-paper-session" >&2
  [ "${1:-}" = logs ] || return 0
  /usr/bin/timeout 20 /usr/bin/rsync -a --max-size=1m --include='/window-*.log' --exclude='*' "${tmp}canon-paper-session/" "$k/" \
    || echo "paper:session: the window logs could not be copied to $k; they are still in ${tmp}canon-paper-session" >&2
  # what that copy left is kept here: a whole log of at most 1024000 bytes, a larger one as its first and last
  # 512000 bytes (both parts and the line between them stay under 1 MB), and a copy that cannot be made is said
  # on stderr with the file's size. A copy already there and newer than the log (one this loop made), or as
  # large as it (one rsync made), is not written again. A copy is made readable as rsync's are (0644, where
  # mktemp gives 0600). A hidden part-copy a kill left is removed first; rsync's patterns never match one.
  /bin/rm -f "$k"/.window-*.log.?????? 2>/dev/null || :
  for f in "${tmp}canon-paper-session/"window-*.log; do
    [ -f "$f" ] || continue
    n=${f##*/}
    [ ! -f "$k/$n" ] || [ ! "$k/$n" -nt "$f" ] || continue
    # shellcheck disable=SC2046  # wc's two counts, split into words
    set -- $(/usr/bin/wc -lc 2>/dev/null < "$f")
    [ "$#" -eq 2 ] || { echo "paper:session: the log $n could not be read to keep it; it is still in ${tmp}canon-paper-session" >&2; continue; }
    lines=$1; bytes=$2
    # shellcheck disable=SC2046  # wc's two counts, split into words
    set -- $(/usr/bin/wc -lc 2>/dev/null < "$k/$n")
    [ "$#" -ne 2 ] || [ "$1" -ne "$lines" ] || [ "$2" -ne "$bytes" ] || continue
    kt=""
    if [ ! -d "$k/$n" ] && kt=$(/usr/bin/mktemp "$k/.$n.XXXXXX" 2>/dev/null) && /bin/chmod 644 "$kt"; then
      if [ "$bytes" -gt 1024000 ]; then
        hl=$(/usr/bin/head -c 512000 "$f" | /usr/bin/wc -l)
        tl=$(/usr/bin/tail -c 512000 "$f" | /usr/bin/wc -l)
        { /usr/bin/head -c 512000 "$f" \
            && echo \
            && echo "paper:session: $n: $bytes bytes, $lines lines; over the 1 MB limit, kept its first and last 512000 bytes, $((bytes - 1024000)) bytes and $((lines - hl - tl)) lines left out" \
            && /usr/bin/tail -c 512000 "$f"; } > "$kt" 2>/dev/null && /bin/mv -f "$kt" "$k/$n" && continue
      else
        /usr/bin/head -c 1048576 "$f" > "$kt" 2>/dev/null && /bin/mv -f "$kt" "$k/$n" && continue
      fi
    fi
    [ -z "$kt" ] || /bin/rm -f "$kt"
    echo "paper:session: $n ($bytes bytes) could not be kept in $k; it is still in ${tmp}canon-paper-session" >&2
  done
}
window() {
  # the switch first, then the pair and account B's lock: here, not above, because the task's arguments reach
  # only the function the script's last line calls (the note above paper:test)
  # the records earlier runs left and never copied (one from a terminal, one stopped before its end): before the
  # switch and with no lock, so a firing that skips keeps them too
  kept
  scheduled "$@"
  [ -n "$ALPACA_API_KEY" ] && [ -n "$ALPACA_SECRET_KEY" ] || { echo "paper:session: a keychain item of account B is empty; run: mise run paper:remove windows, then mise run paper:store windows" >&2; exit 1; }
  exec 9>>"${tmp}canon-paper-windows.lock"
  lock_wait 9 "$lockwait" || { echo "paper:session: account B's lock stayed held for $lockwait s; nothing was placed" >&2; exit 1; }
  waited=$(( $(/bin/date +%s) - start ))
  gapwait
  left=$((deadline - ($(/bin/date +%s) - start)))
  [ "$left" -gt 0 ] || { echo "paper:session: no time left before the deadline" >&2; exit 1; }
  # from a terminal, too, uv's sync runs before the stream lock is taken, so the lock is held only while the
  # window's process runs; exec, so a signal reaches uv as it always did, and the next run's start copies its records
  if [ -t 0 ]; then
    uv run --locked ${CANON_COMMIT:+--exact} /usr/bin/true || exit 1
    stream
    exec uv run --locked ${CANON_COMMIT:+--exact} python -m canon_trading.session_window --log-dir "${tmp}canon-paper-session" "$@"
  fi
  # the start-up, held to `sync`: uv makes the environment uv.lock's before it runs a command (uv docs, `uv
  # run`), here /usr/bin/true, so the window's own `uv run` finds it in step
  b=$sync; [ "$left" -ge "$sync" ] || b=$left
  bounded "$b" uv run --locked ${CANON_COMMIT:+--exact} /usr/bin/true \
    || { echo "paper:session: the start-up (uv making the environment uv.lock's) failed or took over $b s; no window was started" >&2; exit 1; }
  stream
  left=$((deadline - ($(/bin/date +%s) - start)))
  [ "$left" -gt 0 ] || { echo "paper:session: no time left before the deadline" >&2; exit 1; }
  wrc=0
  # the records and logs are kept on every exit, a stop's included: bounded's stop() exits the shell from
  # its trap, after the window's wind-down, and a kept-logs line after the call would never run (a second
  # reader of #323). Set before the call, never from inside a trap (bounded's note on bash 3.2).
  trap 'kept logs' EXIT
  stopgrace=$grace
  bounded "$left" uv run --locked ${CANON_COMMIT:+--exact} python -m canon_trading.session_window --log-dir "${tmp}canon-paper-session" "$@" || wrc=$?
  exit "$wrc"
}
window
'''

# The data-only task (docs/adr/0070-sandbox-execution-on-alpacas-live-data-and-a-data-only-task.md): account A's pair, read as
# paper:test reads it, into this task's environment only (ADR 0070 term 1), for one module from a fixed list
# (term 2 and its addition of 2026-11-11): `sandbox`, the sandbox node (canon_trading.sandbox_node); `movers-stream`
# (canon_trading.movers_stream) and `movers-screener` (canon_trading.movers_screener), the movers probe's two
# modules, which log to canon-paper-data/ in the per-user temporary folder, outside the repository; or `quotes`,
# the historical quote loader ADR 0066 proposes, refused until it is built. CANON_ALPACA_DATA_ONLY=1 makes
# every alpaca-py REST client this repository builds refuse every method but GET before sending, and the data
# client refuse to connect if one would send another; each module sets it again and checks (term 3). It places
# nothing on account A, so it takes no account's lock. A module that streams (`sandbox`, `movers-stream`) takes
# account A's stream lock on descriptor 7 after uv's sync, as a window takes B's, and holds it for its run, so
# a paper test that streams waits for it, and a window, on B's pair, does not (ADR 0069). `movers-screener`
# only reads REST, so it takes no stream lock. deadline: the stream lock's
# wait, the start-up held to `sync`, the imports, the longest run and its stop for a streaming module, and the
# start-up and the screener's 85 polls for the screener, and the start-up, the last load's start and that
# load's timeout for bars-list; tests/test_sandbox_node.py, tests/test_movers_*.py and tests/test_bars_list.py
# hold the sums. Unattended sandbox runs wait for NautilusTrader rc9 (ADR 0068); by hand: mise run paper:data sandbox.
[tasks."paper:data"]
description = "Run one listed data-only module with paper account A's pair, every request but GET refused"
timeout = "100m"
env.ALPACA_API_KEY = { value = "{{ exec(command='/usr/bin/timeout 30 /usr/bin/security find-generic-password -s canon-alpaca-paper -a ALPACA_API_KEY -w') }}", redact = true }
env.ALPACA_SECRET_KEY = { value = "{{ exec(command='/usr/bin/timeout 30 /usr/bin/security find-generic-password -s canon-alpaca-paper -a ALPACA_SECRET_KEY -w') }}", redact = true }
env.CANON_ALPACA_DATA_ONLY = "1"
usage = '''
arg "<module>" help="sandbox: the sandbox node on Alpaca's data (ADR 0070); movers-stream: sip bars and trades for the whole market, rates, memory and a top 50; movers-screener: Alpaca's movers and most-actives once a minute, no stream; quotes: the historical quote loader, not built yet (ADR 0066); bars-list: the bar windows of the list CANON_BARS_LIST names into catalog/bars-list/<feed>/, no stream" {
  choices "sandbox" "movers-stream" "movers-screener" "quotes" "bars-list"
}
flag "--minutes <minutes>" help="how long the module runs: 1 to 60 for sandbox and movers-stream, 1 to 85 polls for movers-screener, 1 to 60 for bars-list (no load starts after it)" default="10"
flag "--rank <feed>" help="sandbox only: the whole-market ranking check on sip or boats, no strategy (2026-11-12)"
flag "--baseline-path <path>" help="sandbox --rank only: the movers baseline the actor reads"
'''
run = '''
deadline=5940
sync=600
lockwait=900
start=$(/bin/date +%s)
[ -n "$ALPACA_API_KEY" ] && [ -n "$ALPACA_SECRET_KEY" ] || { echo "paper:data: a keychain item of account A is empty; run: mise run paper:remove, then mise run paper:store" >&2; exit 1; }
[ "${CANON_ALPACA_DATA_ONLY:-}" = 1 ] || { echo "paper:data: CANON_ALPACA_DATA_ONLY is not 1; nothing was run (ADR 0070)" >&2; exit 1; }
streams=1; logs=0
case "${usage_module:-}" in
  sandbox) module=canon_trading.sandbox_node ;;
  movers-stream) module=canon_trading.movers_stream; logs=1 ;;
  movers-screener) module=canon_trading.movers_screener; streams=0; logs=1 ;;
  bars-list) module=canon_trading.bars_list; streams=0 ;;  # a list of bar windows into catalog/bars-list/<feed>/, CANON_BARS_LIST naming it
  quotes) echo "paper:data: quotes, the historical quote loader, is not built yet (ADR 0066); nothing was run" >&2; exit 1 ;;
  *) echo "paper:data: no module named '${usage_module:-}'; the list is sandbox, movers-stream, movers-screener, quotes and bars-list (ADR 0070)" >&2; exit 3 ;;
esac
tmp="$(/usr/bin/getconf DARWIN_USER_TEMP_DIR)" || tmp=""
case "$tmp" in /*/) ;; *) echo "paper:data: the per-user temporary folder is not known (DARWIN_USER_TEMP_DIR gave '$tmp'), so there is no stream lock to take or log folder to write; nothing was run" >&2; exit 1 ;; esac
set -- --minutes "${usage_minutes:-10}"
[ -z "${usage_rank:-}" ] || { [ "${usage_module:-}" = sandbox ] || { echo "paper:data: --rank is for sandbox only" >&2; exit 3; }; set -- "$@" --rank "$usage_rank"; }
[ -z "${usage_baseline_path:-}" ] || set -- "$@" --baseline-path "$usage_baseline_path"
[ "$logs" = 0 ] || set -- "$@" --log-dir "${tmp}canon-paper-data"
# lock_wait <fd> <secs>: the exclusive lock on an open descriptor, waiting at most <secs>; 0 when held, 1 when the
# bound ran out (a bound can run over by up to a second), or at once when lockf fails for any reason but the
# lock being held (exit 75, EX_TEMPFAIL). lockf(1)'s descriptor form (`lockf -t <secs> <fd>`, man lockf) busy-loops while it waits, about
# 71% of a core after 6 s (measured on this Mac), so this polls `lockf -t 0 <fd>`, which fails unless it can
# take the lock at once, with a one-second sleep: about no CPU. The lock belongs to the open file description,
# so every process the task starts still inherits it (the note above paper:test). The same text is in every
# paper task that waits for a lock (scripts/test-lanes checks that).
lock_wait() {
  lw_end=$(( $(/bin/date +%s) + $2 ))
  while :; do
    /usr/bin/lockf -t 0 "$1" 2>/dev/null; lw_rc=$?
    [ "$lw_rc" = 0 ] && return 0
    [ "$lw_rc" = 75 ] || return 1
    [ "$(/bin/date +%s)" -lt "$lw_end" ] || return 1
    sleep 1
  done
}
# stream: account A's market-data stream lock (ADR 0069), on descriptor 7, waited for as paper:session waits
# for B's; only a module that streams takes it
stream() {
  [ "$streams" = 1 ] || return 0
  exec 7>>"${tmp}canon-alpaca-stream-tests.lock"
  lock_wait 7 "$lockwait" || { echo "paper:data: the market-data stream lock stayed held for $lockwait s; nothing was run" >&2; exit 1; }
}
# bounded <secs> <command...>: as in paper:session (the note above paper:test), but with no `stopgrace`: a stop
# kills the group at once, as paper:test's does
bounded() {
  b=$1; shift; g=""
  stop() { [ -z "$g" ] || kill -s KILL -- "-$g" 2>/dev/null || kill -KILL "$g" 2>/dev/null; exit "$1"; }
  trap 'stop 143' TERM; trap 'stop 129' HUP; trap 'stop 130' INT
  /usr/bin/timeout -s KILL "$b" "$@" & g=$!
  rc=0; wait "$g" || rc=$?
  kill -s KILL -- "-$g" 2>/dev/null || :
  trap - TERM HUP INT
  return "$rc"
}
data() {
  # from a person's terminal uv runs in the terminal's process group, bounded by mise's `timeout`, as
  # paper:test and paper:session run (the note above paper:test); the module bounds its own run too
  if [ -t 0 ]; then
    uv run --locked /usr/bin/true || exit 1
    stream
    exec uv run --locked python -m "$module" "$@"
  fi
  bounded "$sync" uv run --locked /usr/bin/true \
    || { echo "paper:data: the start-up (uv making the environment uv.lock's) failed or took over $sync s; nothing was run" >&2; exit 1; }
  stream
  left=$((deadline - ($(/bin/date +%s) - start)))
  [ "$left" -gt 0 ] || { echo "paper:data: no time left before the deadline" >&2; exit 1; }
  bounded "$left" uv run --locked python -m "$module" "$@"
}
data "$@"
'''

# The historical bars load (docs/adr/0093-paper-history-a-paced-get-only-bars-load.md): one paper account's
# pair, `tests` (A, as paper:test reads it) or `windows` (B, as paper:session reads it), into this task's
# environment only; neither value is printed. A GET-only history load neither trades nor streams, so either
# account's pair may serve it (ADR 0093, the decision of 2026-11-11). It runs canon_trading.history_load in
# data-only mode (ADR 0070): every request but GET is refused before it is sent. It places nothing and opens
# no stream, so it takes no account's lock and no stream lock. The module paces its GETs by ADR 0093's
# row, stops by name at a 429, names `sip` for bars/trades or `iex` for quotes and never falls back. The run is
# held to `deadline` seconds by timeout(1) -s KILL. Trades use the adapter's historical prints fetch and
# the catalog's trade-tick writer, with the same catalog lock, feed marker and pace as bars.
# `--baseline-inputs` (ADR 0087's evening baseline) runs scripts/movers-baseline-inputs.py instead: it also
# sends two trading-API GETs, Alpaca's calendar and its active assets, which ADR 0093's row does not count.
[tasks."paper:history"]
description = "Load historical sip bars or trades, or IEX quotes, for listed symbols with one paper account's pair, GET only, paced; read Alpaca's trade-condition codes per tape; or write a feed's nightly movers baseline from the catalog"
shell = "bash -c"
timeout = "6h"
usage = '''
arg "<account>" help="tests: account A's pair; windows: account B's pair (ADR 0069, ADR 0093)" {
  choices "tests" "windows"
}
arg "[mode]" help="baseline: write from the catalog without reading an account pair; conditions: GET Alpaca's trade-condition codes for tapes A, B and C into <catalog>/conditions/trade.json, and with --symbols, --start and --end each symbol's raw prints with their conditions beside it" {
  choices "baseline" "conditions"
}
flag "--session <date>" help="baseline mode: coming trade date, ISO date"
flag "--sessions-file <file>" help="baseline mode: ordered session calendar including the trade date and five prior sessions"
flag "--feed <feed>" help="baseline mode: one feed, in its own catalog root; default sip" {
  choices "sip" "boats"
}
flag "--max-excluded-share <share>" help="baseline mode: the most of the catalog's equities left out (UNCALIBRATED; default 0.5)"
flag "--baseline-dir <root>" help="baseline mode: write <feed>.json in this directory; default catalog/movers-baseline"
flag "--baseline-inputs <dir>" help="prepare the evening calendar and whole-market asset definitions in this directory, GET only with the selected pair; requires --catalog and --baseline-dir, takes no mode or load flags"
flag "--symbols <symbols>" help="symbols, comma-separated (or --symbols-file)"
flag "--symbols-file <file>" help="a file of symbols, one a line"
flag "--start <start>" help="ISO 8601 with a time zone; required"
flag "--end <end>" help="ISO 8601 with a time zone; required, at least 15 minutes (trades, quotes or 1-MINUTE bars) or a day (1-DAY bars) before now"
flag "--bars <bars>" help="1-MINUTE, 1-DAY or both, comma-separated; default both"
flag "--catalog <root>" help="the catalog root, never under ledger/; default catalog, or catalog/<feed> in baseline mode"
flag "--data <kind>" help="bars (the default) or individual trade prints, on sip (ADR 0093's pace and catalog lock), or IEX quotes from 2025-11-04 New York on over at most 90 days (ADR 0066); --bars applies only to bars" {
  choices "bars" "trades" "quotes"
}
'''
run = '''
deadline=21000
case "${usage_account:-}" in
  tests) svc=canon-alpaca-paper ;;
  windows) svc=canon-alpaca-paper-windows ;;
  *) echo "paper:history: no paper account named '${usage_account:-}'; the names are tests and windows; nothing was read" >&2; exit 3 ;;
esac
# Each mode refuses the other's flags by name, before any pair is read: `--feed boats` in load mode
# would load sip into a boats root. Flags carry no usage default, so an unset one is empty here.
named() { for v in "$@"; do eval "[ -z \"\${usage_$v:-}\" ]" || printf ' --%s' "${v//_/-}"; done; }
module=  # set by a mode that runs its own module; an inherited value is not used
case "${usage_mode:-}" in
  baseline)
    wrong=$(named symbols symbols_file start end bars data baseline_inputs)
    [ -z "$wrong" ] || { echo "paper:history: baseline mode takes no load flag:$wrong; nothing was read" >&2; exit 3; }
    set --
    [ -z "${usage_session:-}" ] || set -- "$@" --session "$usage_session"
    [ -z "${usage_sessions_file:-}" ] || set -- "$@" --sessions-file "$usage_sessions_file"
    set -- "$@" --feed "${usage_feed:-sip}" --catalog "${usage_catalog:-catalog/${usage_feed:-sip}}" --baseline-dir "${usage_baseline_dir:-catalog/movers-baseline}"
    [ -z "${usage_max_excluded_share:-}" ] || set -- "$@" --max-excluded-share "$usage_max_excluded_share"
    exec /usr/bin/timeout -s KILL "$deadline" uv run --locked python -m canon_trading.movers_baseline "$@"
    ;;
  conditions)
    wrong=$(named session sessions_file feed max_excluded_share baseline_dir symbols_file bars data baseline_inputs)
    [ -z "$wrong" ] || { echo "paper:history: conditions mode takes no flag but --catalog, --symbols, --start and --end:$wrong; nothing was read" >&2; exit 3; }
    set -- --out "${usage_catalog:-catalog}/conditions/trade.json"
    [ -z "${usage_symbols:-}" ] || set -- "$@" --symbols "$usage_symbols"
    [ -z "${usage_start:-}" ] || set -- "$@" --start "$usage_start"  # the module refuses one without the others
    [ -z "${usage_end:-}" ] || set -- "$@" --end "$usage_end"
    module=canon_trading.trade_conditions
    ;;
  "")
    if [ -n "${usage_baseline_inputs:-}" ]; then
      wrong=$(named session sessions_file feed max_excluded_share symbols symbols_file start end bars data)
      [ -z "$wrong" ] && [ -n "${usage_catalog:-}" ] && [ -n "${usage_baseline_dir:-}" ] || { echo "paper:history: --baseline-inputs needs --catalog and --baseline-dir, with no mode or other flags:$wrong; nothing was read" >&2; exit 3; }
      module=baseline-inputs
      set -- --directory "$usage_baseline_inputs" --catalog "$usage_catalog" --baseline-dir "$usage_baseline_dir"
    else
      wrong=$(named session sessions_file feed max_excluded_share baseline_dir)
    fi
    [ -z "$wrong" ] || { echo "paper:history: load mode takes no baseline flag:$wrong; give the baseline mode for those; nothing was read" >&2; exit 3; }
    ;;
  *) echo "paper:history: unknown mode '${usage_mode}'; nothing was read" >&2; exit 3 ;;
esac
[ -n "${module:-}" ] || set -- --start "${usage_start:-}" --end "${usage_end:-}" --bars "${usage_bars:-1-MINUTE,1-DAY}" --catalog "${usage_catalog:-catalog}" --data "${usage_data:-bars}"
[ -n "${module:-}" ] || [ -z "${usage_symbols:-}" ] || set -- "$@" --symbols "$usage_symbols"
[ -n "${module:-}" ] || [ -z "${usage_symbols_file:-}" ] || set -- "$@" --symbols-file "$usage_symbols_file"
ALPACA_API_KEY="$(/usr/bin/timeout 30 /usr/bin/security find-generic-password -s "$svc" -a ALPACA_API_KEY -w)" || ALPACA_API_KEY=""
ALPACA_SECRET_KEY="$(/usr/bin/timeout 30 /usr/bin/security find-generic-password -s "$svc" -a ALPACA_SECRET_KEY -w)" || ALPACA_SECRET_KEY=""
[ -n "$ALPACA_API_KEY" ] && [ -n "$ALPACA_SECRET_KEY" ] || { echo "paper:history: account ${usage_account}'s pair is not in the login keychain (mise run paper:check ${usage_account}); nothing was read" >&2; exit 1; }
export ALPACA_API_KEY ALPACA_SECRET_KEY CANON_ALPACA_DATA_ONLY=1
[ "$module" != baseline-inputs ] || exec /usr/bin/timeout -s KILL 300 uv run --locked python scripts/movers-baseline-inputs.py "$@"
exec /usr/bin/timeout -s KILL "$deadline" uv run --locked python -m "${module:-canon_trading.history_load}" "$@"
'''

# Alpaca's long-only account setting on one paper account (`no_shorting`, "If true, account becomes long-only
# mode": https://docs.alpaca.markets/us/reference/patchaccountconfig-1.md; alpaca-py 0.45.0's
# `get_account_configurations` and `set_account_configurations`). A window never opens a short, and its start
# check refuses an account that allows shorting (session_window, "Long-only"). The owner approved on 2026-11-11
# setting it on both paper accounts and reversing it, if ever, by the same call (`off`). `tests` reads account
# A's pair, as paper:test does, and `windows` account B's, as paper:session does (ADR 0069), into this task's
# environment only; neither value is printed. `check` reads only and prints the setting's value. `on` and `off`
# first take that account's lock, so no paper run is mid-way, waiting at most `lockwait` seconds, then run under
# timeout(1) -s KILL. Run from main only (ADR 0028): the setting is a change to the account.
[tasks."paper:long-only"]
description = "Print, or set on or off, Alpaca's long-only setting (no_shorting) on one paper account"
shell = "bash -c"
timeout = "30m"
usage = '''
arg "<account>" help="tests: account A, which paper:test reads; windows: account B, which paper:session reads (ADR 0069)" {
  choices "tests" "windows"
}
arg "<action>" help="check: print the setting; on: make the account long-only; off: reverse it by the same call" {
  choices "check" "on" "off"
}
'''
run = '''
lockwait=900
case "${usage_account:-}" in
  tests) svc=canon-alpaca-paper; lock=canon-paper-test.lock ;;
  windows) svc=canon-alpaca-paper-windows; lock=canon-paper-windows.lock ;;
  *) echo "paper:long-only: no paper account named '${usage_account:-}'; the names are tests and windows; nothing was read" >&2; exit 3 ;;
esac
case "${usage_action:-}" in check|on|off) ;; *) echo "paper:long-only: the action is check, on or off, not '${usage_action:-}'; nothing was read" >&2; exit 3 ;; esac
ALPACA_API_KEY="$(/usr/bin/timeout 30 /usr/bin/security find-generic-password -s "$svc" -a ALPACA_API_KEY -w)" || ALPACA_API_KEY=""
ALPACA_SECRET_KEY="$(/usr/bin/timeout 30 /usr/bin/security find-generic-password -s "$svc" -a ALPACA_SECRET_KEY -w)" || ALPACA_SECRET_KEY=""
[ -n "$ALPACA_API_KEY" ] && [ -n "$ALPACA_SECRET_KEY" ] || { echo "paper:long-only: account ${usage_account}'s pair is not in the login keychain (mise run paper:check ${usage_account}); nothing was read" >&2; exit 1; }
export ALPACA_API_KEY ALPACA_SECRET_KEY CANON_PAPER_ACCOUNT="$usage_account"
[ "$usage_action" = check ] || {
  tmp="$(/usr/bin/getconf DARWIN_USER_TEMP_DIR)" || tmp=""
  case "$tmp" in /*/) ;; *) echo "paper:long-only: the per-user temporary folder is not known, so there is no paper lock to take; nothing was changed" >&2; exit 1 ;; esac
# lock_wait <fd> <secs>: the exclusive lock on an open descriptor, waiting at most <secs>; 0 when held, 1 when the
# bound ran out (a bound can run over by up to a second), or at once when lockf fails for any reason but the
# lock being held (exit 75, EX_TEMPFAIL). lockf(1)'s descriptor form (`lockf -t <secs> <fd>`, man lockf) busy-loops while it waits, about
# 71% of a core after 6 s (measured on this Mac), so this polls `lockf -t 0 <fd>`, which fails unless it can
# take the lock at once, with a one-second sleep: about no CPU. The lock belongs to the open file description,
# so every process the task starts still inherits it (the note above paper:test). The same text is in every
# paper task that waits for a lock (scripts/test-lanes checks that).
lock_wait() {
  lw_end=$(( $(/bin/date +%s) + $2 ))
  while :; do
    /usr/bin/lockf -t 0 "$1" 2>/dev/null; lw_rc=$?
    [ "$lw_rc" = 0 ] && return 0
    [ "$lw_rc" = 75 ] || return 1
    [ "$(/bin/date +%s)" -lt "$lw_end" ] || return 1
    sleep 1
  done
}
  exec 9>>"${tmp}${lock}"
  lock_wait 9 "$lockwait" || { echo "paper:long-only: account ${usage_account}'s lock stayed held for $lockwait s; nothing was changed" >&2; exit 1; }
}
exec /usr/bin/timeout -s KILL 600 uv run --locked python -c 'import sys; from canon_trading.session_window import long_only_task; raise SystemExit(long_only_task(sys.argv[1]))' "$usage_action"
'''

# A read of one paper account (src/canon_trading/custody.py): equity, cash and buying power, each position,
# each open order with its time in force and position intent as Alpaca returns them and whether its client
# order ID is of our nodes' lineage or foreign, and `no_shorting`; then the New York trade date's ended orders
# submitted inside that date (one submitted earlier is not listed), from a closed-order history walk paged at
# the poll interval and printed after the rest, so a failed walk leaves the account read shown. GET only: the task and the module set
# data-only mode (CANON_ALPACA_DATA_ONLY=1, ADR 0070), so the client refuses every other method before
# sending. `tests` reads account A's pair and `windows` account B's (ADR 0069), as
# paper:long-only does, into this task's environment only; neither value is printed, and no account number or
# order ID is. It reads only, so it takes no lock and runs beside a window or a paper test.
[tasks."paper:account"]
description = "Print one paper account: balances, positions, open orders with their lineage, no_shorting, and the trade date's ended orders (GET only)"
shell = "bash -c"
timeout = "10m"
usage = '''
arg "<account>" help="tests: account A, which paper:test reads; windows: account B, which paper:session reads; protect: account C (ADR 0069's pattern)" {
  choices "tests" "windows" "protect"
}
'''
run = '''
case "${usage_account:-}" in
  tests) svc=canon-alpaca-paper ;;
  windows) svc=canon-alpaca-paper-windows ;;
  protect) svc=canon-alpaca-paper-protect ;;
  *) echo "paper:account: no paper account named '${usage_account:-}'; the names are tests, windows and protect; nothing was read" >&2; exit 3 ;;
esac
ALPACA_API_KEY="$(/usr/bin/timeout 30 /usr/bin/security find-generic-password -s "$svc" -a ALPACA_API_KEY -w)" || ALPACA_API_KEY=""
ALPACA_SECRET_KEY="$(/usr/bin/timeout 30 /usr/bin/security find-generic-password -s "$svc" -a ALPACA_SECRET_KEY -w)" || ALPACA_SECRET_KEY=""
[ -n "$ALPACA_API_KEY" ] && [ -n "$ALPACA_SECRET_KEY" ] || { echo "paper:account: account ${usage_account}'s pair is not in the login keychain (mise run paper:check ${usage_account}); nothing was read" >&2; exit 1; }
export ALPACA_API_KEY ALPACA_SECRET_KEY CANON_PAPER_ACCOUNT="$usage_account" CANON_ALPACA_DATA_ONLY=1
echo "account: $usage_account"
exec /usr/bin/timeout -s KILL 300 uv run --locked python -c 'from canon_trading.custody import account_task; raise SystemExit(account_task())'
'''

[tasks."paper:close"]
description = "Cancel and close only what our nodes' lineage wrote on one paper account; freeze and report anything else"
shell = "bash -c"
timeout = "30m"
usage = '''
arg "<account>" help="tests: account A, which paper:test reads; windows: account B, which paper:session reads (ADR 0069)" {
  choices "tests" "windows"
}
'''
run = '''
lockwait=900
case "${usage_account:-}" in
  tests) svc=canon-alpaca-paper; lock=canon-paper-test.lock ;;
  windows) svc=canon-alpaca-paper-windows; lock=canon-paper-windows.lock ;;
  *) echo "paper:close: no paper account named '${usage_account:-}'; the names are tests and windows; nothing was read" >&2; exit 3 ;;
esac
ALPACA_API_KEY="$(/usr/bin/timeout 30 /usr/bin/security find-generic-password -s "$svc" -a ALPACA_API_KEY -w)" || ALPACA_API_KEY=""
ALPACA_SECRET_KEY="$(/usr/bin/timeout 30 /usr/bin/security find-generic-password -s "$svc" -a ALPACA_SECRET_KEY -w)" || ALPACA_SECRET_KEY=""
[ -n "$ALPACA_API_KEY" ] && [ -n "$ALPACA_SECRET_KEY" ] || { echo "paper:close: account ${usage_account}'s pair is not in the login keychain (mise run paper:check ${usage_account}); nothing was read" >&2; exit 1; }
export ALPACA_API_KEY ALPACA_SECRET_KEY CANON_PAPER_ACCOUNT="$usage_account"
tmp="$(/usr/bin/getconf DARWIN_USER_TEMP_DIR)" || tmp=""
case "$tmp" in /*/) ;; *) echo "paper:close: the per-user temporary folder is not known, so there is no paper lock to take; nothing was sent" >&2; exit 1 ;; esac
# lock_wait <fd> <secs>: the exclusive lock on an open descriptor, waiting at most <secs>; 0 when held, 1 when the
# bound ran out (a bound can run over by up to a second), or at once when lockf fails for any reason but the
# lock being held (exit 75, EX_TEMPFAIL). lockf(1)'s descriptor form (`lockf -t <secs> <fd>`, man lockf) busy-loops while it waits, about
# 71% of a core after 6 s (measured on this Mac), so this polls `lockf -t 0 <fd>`, which fails unless it can
# take the lock at once, with a one-second sleep: about no CPU. The lock belongs to the open file description,
# so every process the task starts still inherits it (the note above paper:test). The same text is in every
# paper task that waits for a lock (scripts/test-lanes checks that).
# Here tests/test_custody.py checks it against paper:test's.
lock_wait() {
  lw_end=$(( $(/bin/date +%s) + $2 ))
  while :; do
    /usr/bin/lockf -t 0 "$1" 2>/dev/null; lw_rc=$?
    [ "$lw_rc" = 0 ] && return 0
    [ "$lw_rc" = 75 ] || return 1
    [ "$(/bin/date +%s)" -lt "$lw_end" ] || return 1
    sleep 1
  done
}
exec 9>>"${tmp}${lock}"
lock_wait 9 "$lockwait" || { echo "paper:close: account ${usage_account}'s lock stayed held for $lockwait s; nothing was sent" >&2; exit 1; }
echo "account: $usage_account"
# TERM at 600 s lets the run cancel what it sent (custody.close_task); KILL 30 s later if it has not ended
exec /usr/bin/timeout -s TERM -k 30 600 uv run --locked python -c 'from canon_trading.custody import close_task; raise SystemExit(close_task())'
'''

# One trailing stop Alpaca holds, GTC and marked sell_to_close, for each long no working sell covers, in the regular
# session on one paper account, then exit (src/canon_trading/protect.py, ADR 0142, ADR 0129). Accounts A (tests) and C
# (protect); windows (B) takes --cancel alone, to close a protect-lineage sell left there (the lead's ruling (d)3,
# 2026-11-13), and a send on B is refused by name. --plan-only makes every read and names what each stop would be
# under every registered row, and sends nothing: an account's first run. A run that sends names its row with
# --row (the Mover's registered trail arms; there is no default). --cancel cancels the open stops of the protect
# lineage and nothing else, asks for no session, and sends no order. It reads one account's pair and takes that
# account's lock without waiting: a lock held refuses the run, so the go it was started on is not spent later. Exit
# 0 each long covered (or planned), 1 a read or send failed, 2 a long left uncovered by name, 3 refused by name. With
# --cancel: 0 each protect stop named ended canceled with nothing filled, or none was open; 1 a cancel or a read
# failed, or a stop ended another way; 2 --symbol named a symbol the open listing showed no protect stop in; 3 refused.
[tasks."paper:protect"]
description = "Send one GTC trailing stop Alpaca holds, marked sell_to_close, for each long no working sell covers, on paper account A or C, in the regular session, then exit; --plan-only sends nothing; --cancel cancels the open orders of the protect lineage and sends nothing, and is all B takes"
shell = "bash -c"
timeout = "10m"
usage = '''
arg "<account>" help="tests: account A; protect: account C (ADR 0142); windows: account B, --cancel only" {
  choices "tests" "windows" "protect"
}
flag "--plan-only" help="make every read, print what each stop would be under every registered row (the distance as a share of the price, the level it opens at, what bound it), and send nothing"
flag "--row <row>" help="the registered trail row a sending run plans on: F2 the fixed trail, OWN1 and OWN3 one and three one-minute ATRs; no default, and a send without one is refused" {
  choices "F2" "OWN1" "OWN3"
}
flag "--cancel" help="cancel the open stops of the protect lineage, and nothing else, then exit; sends no order; with --plan-only it names them and cancels nothing"
flag "--symbol <symbol>" help="with --cancel: only this symbol's protect stops; exit 2 when it has none open"
'''
run = '''
case "${usage_account:-}" in
  tests) svc=canon-alpaca-paper; lock=canon-paper-test.lock ;;
  windows)
    # B takes the cancel alone: a protect-lineage sell left on B is closed before proof 3 (ruling (d)3)
    [ "${usage_cancel:-false}" = true ] || { echo "paper:protect: account windows (B) takes only --cancel (the protect lineage's cancel); a send on B is refused by name; nothing was read" >&2; exit 3; }
    svc=canon-alpaca-paper-windows; lock=canon-paper-windows.lock ;;
  protect) svc=canon-alpaca-paper-protect; lock=canon-paper-protect.lock ;;
  *) echo "paper:protect: no paper account named '${usage_account:-}'; the names are tests and protect; nothing was read" >&2; exit 3 ;;
esac
ALPACA_API_KEY="$(/usr/bin/timeout 30 /usr/bin/security find-generic-password -s "$svc" -a ALPACA_API_KEY -w)" || ALPACA_API_KEY=""
ALPACA_SECRET_KEY="$(/usr/bin/timeout 30 /usr/bin/security find-generic-password -s "$svc" -a ALPACA_SECRET_KEY -w)" || ALPACA_SECRET_KEY=""
[ -n "$ALPACA_API_KEY" ] && [ -n "$ALPACA_SECRET_KEY" ] || { echo "paper:protect: account ${usage_account}'s pair is not in the login keychain (mise run paper:check ${usage_account}); nothing was read" >&2; exit 1; }
export ALPACA_API_KEY ALPACA_SECRET_KEY CANON_PAPER_ACCOUNT="$usage_account"
tmp="$(/usr/bin/getconf DARWIN_USER_TEMP_DIR)" || tmp=""
case "$tmp" in /*/) ;; *) echo "paper:protect: the per-user temporary folder is not known, so there is no paper lock to take; nothing was sent" >&2; exit 1 ;; esac
exec 9>>"${tmp}${lock}"
/usr/bin/lockf -t 0 9 2>/dev/null; held=$?
case "$held" in
  0) ;;
  75) echo "paper:protect: refused: account ${usage_account}'s lock is held (a paper run is on it); nothing was sent" >&2; exit 3 ;;
  *) echo "paper:protect: account ${usage_account}'s lock could not be taken (lockf exit $held); nothing was sent" >&2; exit 1 ;;
esac
echo "account: $usage_account"
exec /usr/bin/timeout -s TERM -k 30 300 uv run --locked python -c 'import sys; from canon_trading.protect import task_from_flags; raise SystemExit(task_from_flags(*sys.argv[1:5]))' "${usage_plan_only:-false}" "${usage_row:-}" "${usage_cancel:-false}" "${usage_symbol:-}"
'''

# Contract: ADR 0146's carrying node, ADR 0142's named row and C's lead go, ADR 0069's account/stream
# locks, and OwnerProtector's unit-10 EXTERNAL custody seam. One strategy; no claim, entry or end sale.
# --row is required; F2 and IEX are refused by name. --levels binds optional SYMBOL=PRICE levels only
# to starting holdings. The holds folder and inbox are required explicit paths, read together at start;
# unread or nonempty: refused. Held account/stream locks: refused without waiting. Account A is refused
# on weekdays 04:00-20:00 New York by Alpaca's clock, the movers recorder's hours (it takes no stream
# lock). Never from the main checkout: only from a checkout of its own at a commit (the module refuses a
# checkout on main). On C, at a commit of main, carrying the lead's go naming protect and the row in this
# start step (ADR 0142's procedure, not a login). Its sells are of the protect lineage (custody.PROTECT).
# SIP spans regular and extended hours, BOATS overnight; at most one feed span, sixteen hours on SIP,
# eight on BOATS. Stop cancels this instance's own working orders only and names each holding left
# unprotected by this node. A new owner fill after start on B is SIMULATION ONLY today; paper later on A.
[tasks."paper:protector"]
description = "Run OwnerProtector alone on tests, windows or protect, with a required row and start controls; no end sale; a new fill of the owner after start on B is SIMULATION ONLY today, paper showing later on A"
shell = "bash -c"
timeout = "1000m"
usage = '''
arg "<account>" help="tests: A; windows: B; protect: C, with the lead's account-and-row go" {
  choices "tests" "windows" "protect"
}
flag "--row <row>" required=#true help="OWN1 or OWN3; no default; F2 is refused by name"
flag "--levels <levels>" help="optional starting levels, SYMBOL=PRICE,...; each belongs only to its starting holding"
flag "--minutes <minutes>" help="1-960, default 30; shortened to the current feed span's end"
flag "--feed <feed>" help="sip or boats; otherwise selected from Alpaca's clock/calendar; IEX refused"
flag "--holds-dir <holds_dir>" required=#true help="absolute holds folder; any entry refuses the start"
flag "--inbox <inbox>" required=#true help="absolute inbox file or folder; unread or nonempty refuses the start"
flag "--lead-go <lead_go>" help="on C: carry the lead's start instruction exactly as 'protect OWN1' or 'protect OWN3'"
flag "--lock-wait <lock_wait>" help="0-300, default 0: wait this long for the account's locks, then refuse (the protector runner's successor)"
'''
run = '''
case "${usage_row:-}" in
  OWN1|OWN3) ;;
  F2) echo "paper:protector: F2 is refused by name: a holding's distance is per symbol; nothing was read" >&2; exit 3 ;;
  *) echo "paper:protector: --row must explicitly name OWN1 or OWN3; nothing was read" >&2; exit 3 ;;
esac
case "${usage_account:-}" in
  tests) svc=canon-alpaca-paper ;;
  windows) svc=canon-alpaca-paper-windows ;;
  protect)
    [ "${usage_lead_go:-}" = "protect ${usage_row}" ] || { echo "paper:protector: C requires the lead's go naming protect and ${usage_row} in this start step; nothing was read" >&2; exit 3; }
    svc=canon-alpaca-paper-protect ;;
  *) echo "paper:protector: no such paper account; nothing was read" >&2; exit 3 ;;
esac
case "${usage_feed:-}" in
  ''|sip|boats) ;;
  *) echo "paper:protector: IEX and any feed other than sip or boats are refused; nothing was read" >&2; exit 3 ;;
esac
ALPACA_API_KEY="$(/usr/bin/timeout 30 /usr/bin/security find-generic-password -s "$svc" -a ALPACA_API_KEY -w)" || ALPACA_API_KEY=""
ALPACA_SECRET_KEY="$(/usr/bin/timeout 30 /usr/bin/security find-generic-password -s "$svc" -a ALPACA_SECRET_KEY -w)" || ALPACA_SECRET_KEY=""
[ -n "$ALPACA_API_KEY" ] && [ -n "$ALPACA_SECRET_KEY" ] || { echo "paper:protector: the named account's pair is not in the login keychain; nothing was sent" >&2; exit 1; }
export ALPACA_API_KEY ALPACA_SECRET_KEY CANON_PAPER_ACCOUNT="$usage_account"
args=("$usage_account" --row "$usage_row" --holds-dir "$usage_holds_dir" --inbox "$usage_inbox")
[ -z "${usage_levels:-}" ] || args+=(--levels "$usage_levels")
[ -z "${usage_minutes:-}" ] || args+=(--minutes "$usage_minutes")
[ -z "${usage_feed:-}" ] || args+=(--feed "$usage_feed")
[ -z "${usage_lead_go:-}" ] || args+=(--lead-go "$usage_lead_go")
[ -z "${usage_lock_wait:-}" ] || args+=(--lock-wait "$usage_lock_wait")
# 16 h plus 20 min startup; TERM gives session_window.STOP_GRACE_SECS (785) to stop, then KILL.
# The module takes both canonical locks for its whole lifetime and uses session_window._run_node's
# clock/stop bounds. Nothing invokes the session window's flattening step.
exec /usr/bin/timeout -s TERM -k 785 58800 uv run --locked python -m canon_trading.protector_node "${args[@]}"
'''

# The nightly study (docs/adr/0089-the-nightly-study-loop.md): one firing of canon_trading.nightly_study in
# this checkout, which studies the latest recorded night once and does nothing when there is none: the
# registered rows replayed on the recorder's catalog (catalog/sip in the main checkout), each a trial in the
# ledger, ranked through the gate. It reads no credential, opens no stream, places nothing and takes no paper
# lock. Its records go beside the ledger, in ledger/nightly/ of the main checkout; the paper windows' records
# it counts are the scheduled ones, as paper:session above keeps them in <config>/canon/watch/windows/, which a
# restart leaves, else in the per-user temporary folder, and with neither folder it says so in its record and
# studies all the same. `scripts/automation install` fires it every half
# hour from the main checkout; by hand, `mise run study:nightly`. The timeout is scripts/automation's
# STUDY_DEADLINE.
[tasks."study:nightly"]
description = "Study the latest recorded night once: the registered rows replayed on the recorder's catalog and ranked through the gate"
shell = "bash -c"
timeout = "60m"
run = '''
k="${CLAUDE_CONFIG_DIR:-$HOME/.claude}/canon/watch/windows"
tmp="$(/usr/bin/getconf DARWIN_USER_TEMP_DIR 2>/dev/null)" || tmp=""
if [ -d "$k" ]; then set -- --windows "$k" "$@"
else case "$tmp" in /*/) set -- --windows "${tmp}canon-paper-session" "$@" ;; esac
fi
exec uv run --locked python -m canon_trading.nightly_study "$@"
'''
