statement = """
Six defects left in the trial ledger, the returns matrix and the gate after their first fix:

1. Two processes that create one new ledger file at the same moment race, and one of them crashes.
2. The report's recorded range is in the naive local time the store returns, so it reads differently
   in another time zone. It should be UTC, with its offset.
3. `returns_matrix`, called directly, accepts a return that is not finite.
4. The value told for a trial does not come from the series as the gate accepts it: a run whose
   returns the gate rejects should be told no value, and failed.
5. A run configuration with no strategy is run instead of refused.
6. The rule that ignores the `ledger/` folder matches a folder of that name anywhere in the tree,
   not only at the root.
"""
