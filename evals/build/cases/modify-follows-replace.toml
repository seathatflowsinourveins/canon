admitted = "2026-11-10"
statement = """
The execution client modifies an order by Alpaca's replace. It goes wrong when Alpaca's updates for a
replace arrive late, twice or out of order:

1. When the `replaced` update never reaches the client and the replacement then fills,
   reconciliation reports neither the replacement nor the old order, so the node's order is never
   reported filled and its fill is lost.
2. A replace that Alpaca refuses on the HTTP answer and again with an `order_replace_rejected`
   update gives two `OrderModifyRejected` events for one modify.
3. A `replaced` update delivered twice gives two `OrderUpdated` events.
4. A fill on the replacement that arrives before `replaced` is applied to the node's order under
   the old terms: a fill larger than the old quantity is dropped as an overfill, and the order takes
   the replacement's terms only after the fill.
5. A `canceled` or `expired` update for the old order, arriving after it was replaced, closes the
   node's order while its replacement still works at Alpaca.
6. `pending_replace` is not a status the client maps, so an open order that is mid-replace fails
   start-up reconciliation; one that has fills should be reported partly filled.
7. When the replacement read at `replaced` is itself pending replace, or already replaced again,
   the client raises and generates no `OrderUpdated` instead of following it to the live order.
8. A second modify sent before the first's `replaced`, and refused by Alpaca, is taken for
   alpaca-py's retry of the first when the first replacement already holds the terms it asked for,
   so it gets no `OrderModifyRejected`.
9. A PATCH answer that arrives after its `replaced` was applied is stored and never removed, so
   answers build up for the whole session.
10. When the old order fills before Alpaca rejects its replacement, the client returns before the
    branch written for that case, so nothing says what became of the modify.
"""
