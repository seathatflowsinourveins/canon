statement = """
Five ways a study can pass the gate, or be left unusable, on inputs ADR 0010, ADR 0035 and ADR 0041
do not accept:

1. The data digest and the session days of a run are read from the catalog after the replay, so a
   catalog replaced in between gives the old run the new bars' digest, and mixed inputs pass. The
   digest should be of the bars the run read. A run whose bars cannot all be accounted for, or that
   read a bar outside the sample, should be told failed.
2. Any overlap of the catalog with the sample is accepted, so two configurations pass on a fragment
   of the sample. A run should need the sample covered in full: a part that is missing is refused
   before a trial is asked for, and named, and so is a sample the catalog does not reach at all. A
   stretch that a load showed to hold no bar can be closed by consolidating the catalog.
3. A keyed record that failed before its sample number was written is left out of the ranking,
   instead of stopping it until a later record of its key resolves it. A record that ran to the end
   with no sample number of the study should stop the ranking too, named.
4. A creation interrupted between the study's name and its sample leaves a name that can be neither
   opened nor created again.
5. A session day with no return in a trial's series is dropped from the calendar, so that trial
   ranks on fewer days than it had sessions. Such a day should be refused, and named.
"""
