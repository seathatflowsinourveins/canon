admitted = "2026-11-10"
statement = """
Two defects in the execution client.

1. Cancel-all skips an order that is already `PENDING_CANCEL`. A cancel that got no answer, a read
   timeout for one, leaves the node's order pending cancel while it still works at Alpaca, and a later
   cancel-all does not cancel it again.
2. Alpaca can list an order whose client order ID NautilusTrader cannot hold: empty, or not ASCII, as
   an order made outside the node can carry. Tracing such an order raises outside the handling that
   skips an order the client cannot report, so one closed order like that aborts the mass status and
   with it start-up reconciliation. A closed one should be skipped with a warning. An open one cannot
   be represented, and start-up should fail with a reason that names it. A valid order that replaced
   one should still be reported, under its own ID.
"""
