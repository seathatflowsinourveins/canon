[[defects]]
id = "unholdable-client-id-aborts-startup"
location = "packages/canon-alpaca/src/canon_alpaca/execution.py: AlpacaExecutionClient._order_report"
summary = """
To patch in the trigger type, the report looks the order up in the cache by
ClientOrderId(order.client_order_id), outside order_status_report's except ValueError. NautilusTrader
refuses an empty or non-ASCII ID, which an order made outside the node can carry, so a closed order
like that, skipped with a warning before this commit, now raises out of the mass status and aborts
start-up reconciliation."""
match = "Names _order_report (or its ClientOrderId cache lookup) and says a client order ID NautilusTrader refuses (empty or non-ASCII) now raises outside order_status_report's handling, so a closed such order fails the mass status or start-up instead of being skipped."
reported_by = "claude-opus-high and antigravity, in the reviewer benchmark run 2026-11-10-first"
