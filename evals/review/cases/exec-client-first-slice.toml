[[defects]]
id = "startup-reconciliation-race"
location = "packages/canon-alpaca/tests/test_execution_client.py: run_with_client"
summary = """
The test helper hands the body the execution client as soon as it is connected, while the node's own
startup reconciliation still queries the same client for order status reports. The two race for the
client, so a test that reads the last recorded queries (the open-order window test) sometimes sees the
node's query instead of its own and fails."""
match = "Names the helper (or the window test) and says the node's startup reconciliation can run concurrently with the test body's calls on the same client."
reported_by = "no review; it showed as a flaky test"
fix = "05899f8468e859ed5023dd531d413fc68135d04a"
test = "packages/canon-alpaca/tests/test_execution_client.py::test_open_order_placed_before_the_window_is_reported"
