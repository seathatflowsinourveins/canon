# Workspace root, generated by `uv init --package` (uv 0.13.7) and then edited.
# Layout decision: docs/adr/0012-repository-layout.md.
# This root package holds strategies and node configuration. The venue adapter is a separate
# workspace member under packages/, because upstream keeps the two apart.
[project]
name = "canon-trading"
version = "0.1.0"
description = "Strategies and node configuration for NautilusTrader on Alpaca (paper trading only)"
requires-python = ">=3.14,<3.15"
dependencies = [
    "canon-alpaca",
    "nautilus-trader==2.0.0rc8",
    "optuna==5.0.0",
    "pandas==3.1.1",
    "skfolio==1.12.9",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
canon-alpaca = { workspace = true }

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.4",
    "ty==0.0.101",
]

# Lint and format (docs/adr/0013-quality-gates.md). Line length and import style follow NautilusTrader's
# own python/pyproject.toml so that adapter code reads like upstream. Rules are ruff's defaults plus
# import sorting; member packages inherit this section.
[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.lint.isort]
force-single-line = true
