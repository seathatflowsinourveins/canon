# Workspace member, generated by `uv init --lib` (uv 0.13.7) and then edited.
# Named canon-alpaca on purpose: NautilusTrader's maintainer asked that the name `nautilus-alpaca`
# stay free for a future official adapter (issue #3374).
[project]
name = "canon-alpaca"
version = "0.1.0"
description = "Out-of-tree NautilusTrader adapter for Alpaca, built on alpaca-py (data slice, no orders)"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "alpaca-py==0.45.0",
    "nautilus-trader==2.0.0rc8",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
