# CI for Canon (docs/adr/0013-quality-gates.md, docs/adr/0014-landing-workflow.md).
# It runs scripts/ci, the same script the commit gate and scripts/land run, on Ubuntu, split into five parts
# that run at once on their own runners (ADR 0144, amendment of 2026-11-14): `rest`, every check but the
# root pytest, and the root pytest's parts 1 to 4, each collected test in exactly one; and on a hosted macOS
# runner the two self-tests whose cases need lockf(1), plutil(1) and an expect(1) that opens a pseudo-terminal
# at /usr/bin, as macOS has them, and which skip those cases on Ubuntu (ADR 0082).
#
# The ruleset on main requires this workflow's `all required checks passed` job, and the `signoff` status
# that scripts/land posts after its quick checks pass locally (ADR 0144). Checked with actionlint.
# Both actions are referenced by commit SHA; the SHAs are the ones canon/upstreams.lock.json records for
# `actions-checkout` and `mise-action`, and `scripts/canon lint` fails if they stop matching.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A pull request's newer push cancels its older run; a push to main has no head_ref and gets a group of its own
# (the run id), so one landing never cancels the run of the landing before it, the macOS job's included. The
# group GitHub's concurrency docs give for "cancels in-progress jobs or runs on pull_request events only".
concurrency:
  group: ci-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # One job per part, a matrix as uv's own workflow splits its tests (`fail-fast: false` and
  # `partition: [1, 2, 3]`, pinned uv, .github/workflows/test.yml:244-248;
  # https://docs.github.com/en/actions/using-jobs/using-a-matrix-for-your-jobs): fail-fast off, so one
  # failing part does not cancel the others and every failure is shown. required-checks-passed needs this
  # job, as uv's own required job needs its matrix job (pinned uv, .github/workflows/ci.yml:440-495), so the
  # one required check fails unless every part succeeded.
  check:
    name: checks (${{ matrix.part }})
    runs-on: ubuntu-24.04
    # On 2026-11-14 passing runs took 23-38 min created to updated (main 43617194822 33.9 min, 43614583851 36.5;
    # PR 43579294655 38.4), up from 22 min on 2026-11-13, and runs 43621264808 and 43621201927 were cancelled
    # at the earlier 40-minute limit; scripts/land waits 95 (ADR 0144)
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        part: [rest, 1/4, 2/4, 3/4, 4/4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the secret scan reads the whole history
          persist-credentials: false

      # Installs exactly what mise.lock records (the action uses --locked when a lockfile is present),
      # so CI runs the same uv, shellcheck, gitleaks and actionlint as the development machine.
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.11.6
          cache: false

      - name: Install the locked Python environment
        run: uv sync --locked

      - name: Run this part's checks
        env:
          PART: ${{ matrix.part }}
        run: scripts/ci --part "$PART"

  # The self-test cases Ubuntu skips, run where they can run: the paper runner under lockf(1) and timeout(1),
  # the paper lock's deadline and the sandbox node's stream lock, and the LaunchAgent plists read back with
  # plutil(1). No credential, no paper run, no keychain item (CANON_TEST_NO_KEYCHAIN skips, by name, the one
  # case that writes to the login keychain), and launchctl is a stand-in in both scripts, so nothing is loaded
  # into launchd. CANON_TEST_ALLOWED_SKIPS makes any other skipped case of test-lanes a failure, and the
  # test-maintenance step fails unless its last line reports cases passed. xcode-27 is the one hosted macOS 27
  # label, a standard runner and a preview image; a version label, not macos-latest, so the OS version moves
  # only when this line does (the image itself is updated weekly). Neither it (macOS 27.0.1) nor macos-26 has
  # /usr/bin/timeout, without which 113 test-lanes cases fail and test-maintenance skips, so the first step
  # checks for it and, while it is missing, the job runs nothing and says so; once an image ships it, the
  # cases run with no edit here. Not among required-checks-passed's needs: it reports and does not block until
  # a GA macOS 27 label exists and it has run its cases and passed on three landings there (ADR 0082).
  macos:
    name: macOS self-tests
    runs-on: xcode-27
    timeout-minutes: 20
    defaults:
      run:
        shell: bash # bash --noprofile --norc -eo pipefail: tee below keeps the script's exit status
    env:
      CANON_TEST_NO_KEYCHAIN: 1
      CANON_TEST_ALLOWED_SKIPS: "paper:store on a terminal"
    steps:
      # Without /usr/bin/timeout the job runs nothing: one warning naming the image and its macOS version, a
      # step summary saying nothing ran, so a green tick is not read as a pass, and every later step skipped.
      # The image is read from the imagedata.json the runner-images build writes (configure-preimagedata.sh).
      - name: Whether this image has /usr/bin/timeout
        id: gate
        run: |
          if [ -x /usr/bin/timeout ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          image=$(jq -r '.[] | select(.group == "Runner Image") | .detail' "$HOME/imagedata.json" 2>/dev/null \
            | sed -n 's/^Image: //p; s/^Version: //p' | paste -sd ' ' - || true)
          msg="${image:-an image that \$HOME/imagedata.json does not name} on macOS $(sw_vers -productVersion) ($(sw_vers -buildVersion)) has no /usr/bin/timeout"
          echo "run=false" >> "$GITHUB_OUTPUT"
          echo "::warning title=macOS self-tests did not run::$msg, so no case ran (ADR 0082)"
          echo "**Nothing ran.** $msg, so no macOS self-test case ran and this job's green tick is not a pass (ADR 0082)." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ steps.gate.outputs.run == 'true' }}
        with:
          persist-credentials: false

      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        if: ${{ steps.gate.outputs.run == 'true' }}
        with:
          version: 2026.11.6
          cache: false

      # Fails naming any other tool the cases need that is missing; the two scripts still run after it, so their
      # own failures show too.
      - name: The macOS tools the cases need
        if: ${{ steps.gate.outputs.run == 'true' }}
        run: |
          sw_vers; /bin/bash --version | head -n 1
          missing=""
          for t in lockf plutil expect getconf jq nc sqlite3 security; do
            if [ -x "/usr/bin/$t" ]; then echo "/usr/bin/$t"; else missing="$missing /usr/bin/$t"; fi
          done
          if [ -n "$missing" ]; then echo "::error title=missing on this image::$missing"; exit 1; fi

      - name: test-lanes
        if: ${{ !cancelled() && steps.gate.outputs.run == 'true' }}
        run: scripts/test-lanes

      # test-maintenance has no strict mode; its last line must report cases passed and none failed, which a
      # run that skips as a whole ("0 passed, 0 failed, 1 skipped") does not
      - name: test-maintenance
        if: ${{ !cancelled() && steps.gate.outputs.run == 'true' }}
        run: |
          scripts/test-maintenance | tee "$RUNNER_TEMP/test-maintenance.out"
          if ! tail -n 1 "$RUNNER_TEMP/test-maintenance.out" | grep -Eqx 'test-maintenance: [1-9][0-9]* passed, 0 failed'; then
            echo "::error title=test-maintenance did not run its cases::its last line: $(tail -n 1 "$RUNNER_TEMP/test-maintenance.out")"
            exit 1
          fi

  # The one status check that branch rules require, so jobs can be added above without touching the
  # repository's settings. Same shape as the `required-checks-passed` job in astral-sh/uv and astral-sh/ruff.
  required-checks-passed:
    name: all required checks passed
    if: ${{ always() }}
    needs: [check]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fail unless every required job succeeded
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          failing=$(echo "$NEEDS_JSON" | jq -r 'to_entries[] | select(.value.result != "success") | "\(.key): \(.value.result)"')
          if [ -n "$failing" ]; then
            echo "$failing"
            exit 1
          fi
