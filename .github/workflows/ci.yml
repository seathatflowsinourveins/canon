# CI for Canon (docs/adr/0013-quality-gates.md, docs/adr/0014-landing-workflow.md).
# It runs scripts/ci, the same script the commit gate and scripts/land run, on Ubuntu; and on a hosted macOS
# runner the two self-tests whose cases need lockf(1), plutil(1) and an expect(1) that opens a pseudo-terminal
# at /usr/bin, as macOS has them, and which skip those cases on Ubuntu (ADR 0082).
#
# The ruleset on main requires this workflow's `all required checks passed` job, and the `signoff` status
# that scripts/land posts after the same checks pass locally. Checked with actionlint.
# Both actions are referenced by commit SHA; the SHAs are the ones canon/upstreams.lock.json records for
# `actions-checkout` and `mise-action`, and `scripts/canon lint` fails if they stop matching.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A pull request's newer push cancels its older run; a push to main has no head_ref and gets a group of its own
# (the run id), so one landing never cancels the run of the landing before it, the macOS job's included. The
# group GitHub's concurrency docs give for "cancels in-progress jobs or runs on pull_request events only".
concurrency:
  group: ci-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  check:
    name: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the secret scan reads the whole history
          persist-credentials: false

      # Installs exactly what mise.lock records (the action uses --locked when a lockfile is present),
      # so CI runs the same uv, shellcheck, gitleaks and actionlint as the development machine.
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.11.6
          cache: false

      - name: Install the locked Python environment
        run: uv sync --locked

      - name: Run every check
        run: scripts/ci

  # The self-test cases Ubuntu skips, run where they can run: the paper runner under lockf(1) and timeout(1),
  # the paper lock's deadline and the sandbox node's stream lock, and the LaunchAgent plists read back with
  # plutil(1). No credential, no paper run, no keychain item (CANON_TEST_NO_KEYCHAIN skips, by name, the one
  # case that writes to the login keychain), and launchctl is a stand-in in both scripts, so nothing is loaded
  # into launchd. CANON_TEST_ALLOWED_SKIPS makes any other skipped case of test-lanes a failure, and the
  # test-maintenance step fails unless its last line reports cases passed. A version label, not macos-latest,
  # so the OS version moves only when this line does (the image itself is updated weekly). Not yet among required-checks-passed's needs: it reports and does not block
  # until it has passed on three landings (ADR 0082).
  macos:
    name: macOS self-tests
    runs-on: macos-26
    timeout-minutes: 20
    defaults:
      run:
        shell: bash # bash --noprofile --norc -eo pipefail: tee below keeps the script's exit status
    env:
      CANON_TEST_NO_KEYCHAIN: 1
      CANON_TEST_ALLOWED_SKIPS: "paper:store on a terminal"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.11.6
          cache: false

      # Fails naming any tool the cases need that is missing; the two scripts still run after it, so their
      # own failures show too.
      - name: The macOS tools the cases need
        run: |
          sw_vers; /bin/bash --version | head -n 1
          missing=""
          for t in lockf timeout plutil expect getconf jq nc sqlite3 security; do
            if [ -x "/usr/bin/$t" ]; then echo "/usr/bin/$t"; else missing="$missing /usr/bin/$t"; fi
          done
          if [ -n "$missing" ]; then echo "::error title=missing on this image::$missing"; exit 1; fi

      - name: test-lanes
        if: ${{ !cancelled() }}
        run: scripts/test-lanes

      # test-maintenance has no strict mode; its last line must report cases passed and none failed, which a
      # run that skips as a whole ("0 passed, 0 failed, 1 skipped") does not
      - name: test-maintenance
        if: ${{ !cancelled() }}
        run: |
          scripts/test-maintenance | tee "$RUNNER_TEMP/test-maintenance.out"
          if ! tail -n 1 "$RUNNER_TEMP/test-maintenance.out" | grep -Eqx 'test-maintenance: [1-9][0-9]* passed, 0 failed'; then
            echo "::error title=test-maintenance did not run its cases::its last line: $(tail -n 1 "$RUNNER_TEMP/test-maintenance.out")"
            exit 1
          fi

  # The one status check that branch rules require, so jobs can be added above without touching the
  # repository's settings. Same shape as the `required-checks-passed` job in astral-sh/uv and astral-sh/ruff.
  required-checks-passed:
    name: all required checks passed
    if: ${{ always() }}
    needs: [check]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fail unless every required job succeeded
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          failing=$(echo "$NEEDS_JSON" | jq -r 'to_entries[] | select(.value.result != "success") | "\(.key): \(.value.result)"')
          if [ -n "$failing" ]; then
            echo "$failing"
            exit 1
          fi
